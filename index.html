<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Protocol</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  font-family: 'Courier New', monospace;
  color: #00f0ff;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game-container {
  position: relative;
  width: 480px;
  height: 700px;
  background: #0a0a0f;
  border: 2px solid #00f0ff;
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 60px rgba(0, 240, 255, 0.05);
  overflow: hidden;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* CRT scanline overlay */
#crt-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15) 0px,
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 10;
}

/* CRT flicker */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  92% { opacity: 1; }
  93% { opacity: 0.8; }
  94% { opacity: 1; }
}

#game-container::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
  pointer-events: none;
  z-index: 11;
}

/* HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40px;
  background: rgba(10, 10, 15, 0.9);
  border-bottom: 1px solid #00f0ff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  font-size: 11px;
  z-index: 20;
  letter-spacing: 1px;
}

#hud-left { display: flex; gap: 16px; }
#hud-right { display: flex; gap: 12px; align-items: center; }

.hud-label { color: #666; font-size: 9px; }
.hud-value { color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }

#floor-indicator { color: #ff00aa; text-shadow: 0 0 8px #ff00aa; }
#score-value { color: #00f0ff; }
#balls-display { display: flex; gap: 3px; }
.ball-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #00f0ff;
  box-shadow: 0 0 6px #00f0ff;
}
.ball-dot.empty { background: #333; box-shadow: none; }

#shop-btn {
  background: transparent;
  border: 1px solid #ff00aa;
  color: #ff00aa;
  padding: 3px 8px;
  font-family: inherit;
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.15s;
}
#shop-btn:hover {
  background: #ff00aa;
  color: #0a0a0f;
  box-shadow: 0 0 10px #ff00aa;
}

/* Objective bar */
#objective-bar {
  position: absolute;
  top: 40px; left: 0; right: 0;
  height: 6px;
  background: #1a1a2e;
  z-index: 20;
}
#objective-fill {
  height: 100%;
  background: linear-gradient(90deg, #00f0ff, #00ffaa);
  width: 0%;
  transition: width 0.3s;
  box-shadow: 0 0 10px #00f0ff;
}
#objective-label {
  position: absolute;
  top: 48px; right: 10px;
  font-size: 9px;
  color: #666;
  z-index: 20;
}

/* Payload display */
#payload-display {
  position: absolute;
  bottom: 10px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 20;
}

.payload-slot {
  width: 36px; height: 36px;
  border: 1px solid #00f0ff44;
  background: rgba(0, 240, 255, 0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: #00f0ff88;
}
.payload-slot.active {
  border-color: #00f0ff;
  background: rgba(0, 240, 255, 0.15);
  color: #00f0ff;
  box-shadow: 0 0 8px #00f0ff44;
}

/* Menu overlay */
#menu-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 15, 0.97);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
}

#menu-overlay.hidden { display: none; }

.game-title {
  font-size: 28px;
  letter-spacing: 6px;
  color: #00f0ff;
  text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
  animation: glitch 3s infinite;
}

@keyframes glitch {
  0%, 90%, 100% { transform: translate(0); filter: none; }
  91% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
  92% { transform: translate(2px, -1px); filter: hue-rotate(-90deg); }
  93% { transform: translate(0); filter: none; }
}

.subtitle {
  font-size: 11px;
  color: #ff00aa;
  letter-spacing: 4px;
  text-shadow: 0 0 10px #ff00aa;
}

.menu-stats {
  font-size: 10px;
  color: #666;
  text-align: center;
  line-height: 1.8;
}

.stat-value { color: #00f0ff; }
.stat-rank { color: #ff00aa; }

.game-btn {
  background: transparent;
  border: 2px solid #00f0ff;
  color: #00f0ff;
  padding: 12px 36px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.2s;
  text-shadow: 0 0 10px #00f0ff;
}
.game-btn:hover {
  background: #00f0ff;
  color: #0a0a0f;
  box-shadow: 0 0 30px #00f0ff;
}

.game-btn.secondary {
  border-color: #ff00aa;
  color: #ff00aa;
  font-size: 10px;
  padding: 8px 20px;
}
.game-btn.secondary:hover {
  background: #ff00aa;
  color: #0a0a0f;
  box-shadow: 0 0 20px #ff00aa;
}

/* Shop overlay */
#shop-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 15, 0.97);
  z-index: 100;
  display: none;
  flex-direction: column;
  padding: 20px;
  overflow-y: auto;
}

#shop-overlay.active { display: flex; }

.shop-header {
  text-align: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #00f0ff33;
  padding-bottom: 15px;
}

.shop-title { font-size: 16px; letter-spacing: 4px; color: #ff00aa; text-shadow: 0 0 10px #ff00aa; }
.shop-credits { font-size: 11px; color: #00f0ff; margin-top: 5px; }

.shop-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex: 1;
}

.shop-item {
  border: 1px solid #00f0ff44;
  background: rgba(0, 240, 255, 0.03);
  padding: 12px;
  transition: all 0.15s;
}
.shop-item:hover {
  border-color: #00f0ff;
  background: rgba(0, 240, 255, 0.08);
}
.shop-item.owned {
  border-color: #ff00aa44;
  background: rgba(255, 0, 170, 0.05);
}

.item-icon { font-size: 18px; margin-bottom: 5px; }
.item-name { font-size: 10px; color: #00f0ff; margin-bottom: 3px; }
.item-desc { font-size: 8px; color: #666; line-height: 1.4; margin-bottom: 8px; }
.item-cost { font-size: 10px; color: #ffaa00; }
.item-owned-badge { font-size: 8px; color: #ff00aa; margin-top: 5px; }

.shop-buy-btn {
  background: transparent;
  border: 1px solid #00f0ff;
  color: #00f0ff;
  padding: 4px 10px;
  font-family: inherit;
  font-size: 9px;
  cursor: pointer;
  width: 100%;
  transition: all 0.15s;
}
.shop-buy-btn:hover:not(:disabled) {
  background: #00f0ff;
  color: #0a0a0f;
}
.shop-buy-btn:disabled {
  border-color: #333;
  color: #333;
  cursor: not-allowed;
}

.shop-continue-btn {
  margin-top: 15px;
  text-align: center;
}

/* Floor complete overlay */
#floor-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 15, 0.95);
  z-index: 90;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
#floor-overlay.active { display: flex; }

.floor-complete-title {
  font-size: 20px;
  letter-spacing: 4px;
  color: #00ffaa;
  text-shadow: 0 0 20px #00ffaa;
  animation: pulse 0.5s ease-out;
}
@keyframes pulse {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.floor-stats {
  font-size: 11px;
  color: #888;
  text-align: center;
  line-height: 2;
}
.floor-stat-value { color: #00f0ff; }

/* Drop zone indicator */
#drop-zone {
  position: absolute;
  top: 46px; left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 15;
  pointer-events: none;
}

#drop-indicator {
  width: 40px; height: 40px;
  border: 2px dashed #00f0ff44;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #00f0ff44;
  transition: all 0.1s;
}
#drop-indicator.active {
  border-color: #00f0ff;
  color: #00f0ff;
  box-shadow: 0 0 15px #00f0ff44;
}

/* Multiplier display */
#multiplier-display {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 36px;
  font-weight: 900;
  color: #00f0ff;
  text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff88;
  z-index: 30;
  letter-spacing: -1px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.15s;
  transform: scale(0.7);
  pointer-events: none;
}
#multiplier-display.show {
  opacity: 1;
  transform: scale(1);
  animation: multPulse 0.4s ease-out;
}
#multiplier-display.xhigh {
  font-size: 44px;
  color: #ff00aa;
  text-shadow: 0 0 20px #ff00aa, 0 0 40px #ff00aa88;
  animation: multPulseBig 0.5s ease-out;
}
#multiplier-display.xmax {
  font-size: 52px;
  color: #ffd700;
  text-shadow: 0 0 25px #ffd700, 0 0 50px #ffd700aa;
  animation: multPulseMax 0.6s ease-out;
}
@keyframes multPulse {
  0% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
@keyframes multPulseBig {
  0% { transform: scale(1.5); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes multPulseMax {
  0% { transform: scale(1.7); filter: brightness(1.5); }
  50% { transform: scale(1.15); filter: brightness(1.2); }
  100% { transform: scale(1); filter: brightness(1); }
}
  transition: opacity 0.2s;
}
/* Multiplier display — styles above */

/* Run end overlay */
#runend-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 15, 0.97);
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
#runend-overlay.active { display: flex; }

.runend-title {
  font-size: 18px;
  letter-spacing: 4px;
}
.runend-title.win { color: #00ffaa; text-shadow: 0 0 20px #00ffaa; }
.runend-title.lose { color: #ff2244; text-shadow: 0 0 20px #ff2244; }

.runend-stats {
  font-size: 11px;
  color: #888;
  text-align: center;
  line-height: 2.2;
}
.runend-stat-value { color: #00f0ff; }
.runend-credit-gain { color: #ffaa00; }

/* Instructions */
.instructions {
  font-size: 9px;
  color: #444;
  text-align: center;
  max-width: 300px;
  line-height: 1.6;
}

/* Slot Protocol 2.0 animations */
@keyframes jpGlitch {
  0%   { transform: skewX(0deg); filter: hue-rotate(0deg); }
  25%  { transform: skewX(-8deg); filter: hue-rotate(20deg); color: #ff6600; }
  50%  { transform: skewX(6deg); filter: hue-rotate(-15deg); color: #ffd700; }
  75%  { transform: skewX(-4deg); filter: hue-rotate(10deg); color: #ffffff; }
  100% { transform: skewX(0deg); filter: hue-rotate(0deg); }
}

@keyframes jpPromptPulse {
  0%   { opacity: 0.6; transform: scale(0.95); }
  100% { opacity: 1;   transform: scale(1.05); }
}

@keyframes frenzyTextPulse {
  0%   { opacity: 0.7; transform: scale(1); }
  100% { opacity: 1;   transform: scale(1.08); }
}

@keyframes frenzyBorder {
  0%,100% { box-shadow: 0 0 20px rgba(255,0,170,0.4), inset 0 0 20px rgba(255,0,170,0.05); }
  50%      { box-shadow: 0 0 40px rgba(255,0,170,0.8), inset 0 0 40px rgba(255,0,170,0.2); }
}

@keyframes frenzySlam {
  0%   { transform: scale(3) rotate(-3deg); opacity: 0; }
  60%  { transform: scale(0.9) rotate(1deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes reelSpin {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-36px); }
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas" width="480" height="700"></canvas>
  <div id="crt-overlay"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div>
        <div class="hud-label">FLOOR</div>
        <div id="floor-indicator" class="hud-value">1/5</div>
      </div>
      <div>
        <div class="hud-label">BREACH</div>
        <div id="score-value" class="hud-value">0</div>
      </div>
    </div>
    <div id="hud-right">
      <div id="balls-display"></div>
      <button id="shop-btn">SHOP</button>
    </div>
  </div>

  <!-- Objective bar -->
  <div id="objective-bar">
    <div id="objective-fill"></div>
  </div>
  <div id="objective-label">CLEAR 20 PEGS</div>

  <!-- Drop zone -->
  <div id="drop-zone">
    <div id="drop-indicator">◉</div>
  </div>

  <!-- Multiplier -->
  <div id="multiplier-display">x1</div>

  <!-- Payload slots -->
  <div id="payload-display">
    <div class="payload-slot" id="payload-slot-0">—</div>
    <div class="payload-slot" id="payload-slot-1">—</div>
  </div>

  <!-- Menu overlay -->
  <div id="menu-overlay">
    <div class="game-title">SLOT PROTOCOL</div>
    <div class="subtitle">// BREACH SEQUENCE INITIATED //</div>
    <div class="menu-stats">
      <div>RANK: <span class="stat-rank" id="menu-rank">SCRIPT KIDDIE</span></div>
      <div>REPUTATION: <span class="stat-value" id="menu-rep">0</span></div>
      <div>LIFETIME BREACH: <span class="stat-value" id="menu-breach">0</span></div>
    </div>
    <button class="game-btn" id="start-btn">INITIATE BREACH</button>
    <button class="game-btn secondary" id="reset-btn">RESET PROGRESS</button>
    <div class="instructions">
      Click to drop ball • Stack payloads for combos • Clear pegs to breach
    </div>
  </div>

  <!-- Shop overlay -->
  <div id="shop-overlay">
    <div class="shop-header">
      <div class="shop-title">◈ NETSHOP ◈</div>
      <div>CREDITS: <span id="shop-credits">0</span></div>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
    <div class="shop-continue-btn">
      <button class="game-btn secondary" id="shop-continue-btn">CONTINUE →</button>
    </div>
  </div>

  <!-- Floor complete overlay -->
  <div id="floor-overlay">
    <div class="floor-complete-title" id="floor-complete-title">FLOOR BREACHED</div>
    <div class="floor-stats" id="floor-stats"></div>

    <!-- Jackpot Slot Machine -->
    <div id="jackpot-machine" style="display:flex;flex-direction:column;align-items:center;margin:12px 0;gap:8px;">
      <div style="font-size:10px;color:#ff00aa;letter-spacing:3px;text-shadow:0 0 10px #ff00aa;">JACKPOT SLOTS</div>
      <div style="display:flex;gap:6px;padding:8px;background:#0d0d18;border:1px solid #ff00aa44;border-radius:6px;box-shadow:0 0 15px #ff00aa22;">
        <div class="reel" id="reel-0" style="width:32px;height:36px;background:#111122;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:18px;color:#00f0ff;text-shadow:0 0 6px #00f0ff;">☢</div>
        <div class="reel" id="reel-1" style="width:32px;height:36px;background:#111122;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:18px;color:#00f0ff;text-shadow:0 0 6px #00f0ff;">☠</div>
        <div class="reel" id="reel-2" style="width:32px;height:36px;background:#111122;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:18px;color:#00f0ff;text-shadow:0 0 6px #00f0ff;">◈</div>
      </div>
      <div id="jp-banner" style="min-height:20px;"></div>
      <button class="game-btn" id="jp-spin-btn" style="font-size:11px;padding:6px 16px;">SPIN</button>
      <button class="game-btn secondary" id="jp-continue-btn" style="display:none;font-size:11px;padding:6px 16px;">CONTINUE</button>
    </div>

    <button class="game-btn" id="floor-continue-btn">PROCEED</button>
  </div>

  <!-- Run end overlay -->
  <div id="runend-overlay">
    <div class="runend-title" id="runend-title">RUN COMPLETE</div>
    <div class="runend-stats" id="runend-stats"></div>
    <button class="game-btn" id="runend-btn">RETURN TO MENU</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// SLOT PROTOCOL - Cyberpunk Pachinko
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 700;

// ─── COLOR PALETTE ───────────────────────────────────────────
const C = {
  void: '#0a0a0f',
  cyan: '#00f0ff',
  magenta: '#ff00aa',
  amber: '#ffaa00',
  danger: '#ff2244',
  green: '#00ffaa',
  purple: '#aa44ff',
  white: '#ffffff',
  dim: '#333344',
  gridLine: '#151525'
};

// ─── GAME STATE ─────────────────────────────────────────────
const GS = {
  screen: 'menu', // menu | playing | shop | floor_complete | run_end
  floor: 1,
  score: 0,
  breachCredits: 0,
  reputation: 0,
  rank: 'Script Kiddie',
  balls: 5,
  ballsInPlay: [],
  multiplier: 1,
  multiplierTimer: 0,
  chainTimer: 0,
  currentPayloads: [],
  board: [],
  floorObjective: { type: 'standard', target: 20, progress: 0, label: 'CLEAR 20 PEGS' },
  pegsHit: new Set(),
  unlockedPayloads: ['scrambler', 'trojan'],
  unlockedUpgrades: [],
  payloadInventory: [],
  totalBallsUsed: 0,
  totalPegsCleared: 0,
  // Slot Protocol 2.0
  timeScale: 1.0, // slow-mo scale
  slowmoBall: null, // reference to ball with slowmo active
  // Frenzy
  comboCount: 0,
  comboThreshold: 5,
  frenzyActive: false,
  frenzyReady: false,
  // Jackpot
  slotReels: [0, 0, 0],
  slotSpinning: false,
  slotResult: null
};

// ─── PERSISTENT STATE ────────────────────────────────────────
let PERSIST = {
  reputation: 0,
  lifetimeBreach: 0,
  totalRuns: 0,
  bestFloor: 0,
  unlockedPayloads: ['scrambler', 'trojan'],
  unlockedUpgrades: []
};

function loadPersist() {
  try {
    const d = localStorage.getItem('slotprotocol');
    if (d) PERSIST = JSON.parse(d);
    GS.unlockedPayloads = PERSIST.unlockedPayloads;
    GS.unlockedUpgrades = PERSIST.unlockedUpgrades;
  } catch(e) {}
}
function savePersist() {
  PERSIST.unlockedPayloads = GS.unlockedPayloads;
  PERSIST.unlockedUpgrades = GS.unlockedUpgrades;
  PERSIST.reputation = GS.reputation;
  PERSIST.lifetimeBreach = GS.lifetimeBreach;
  PERSIST.totalRuns++;
  if (GS.floor > PERSIST.bestFloor) PERSIST.bestFloor = GS.floor;
  localStorage.setItem('slotprotocol', JSON.stringify(PERSIST));
}

// ─── PAYLOAD DEFINITIONS ─────────────────────────────────────
const PAYLOADS = {
  scrambler: { name: 'SCRAMBLER', icon: '◎', color: '#00f0ff', desc: 'Reverses ball', rarity: 'common', cost: 50 },
  trojan: { name: 'TROJAN', icon: '◈', color: '#ff00aa', desc: 'Clone on hit', rarity: 'uncommon', cost: 100 },
  worm: { name: 'WORM', icon: '≡', color: '#00ffaa', desc: 'Pierce pegs', rarity: 'rare', cost: 200 },
  logicbomb: { name: 'LOGIC BOMB', icon: '✷', color: '#ffaa00', desc: 'Explode radius', rarity: 'rare', cost: 250 },
  daemon: { name: 'DAEMON', icon: '✺', color: '#aa44ff', desc: 'Split x3', rarity: 'legendary', cost: 500 },
  // Slot Protocol 2.0 payloads
  ghost: { name: 'GHOST', icon: '▣', color: '#ff88ff', desc: 'Phase through 3-5 pegs', rarity: 'rare', cost: 175, unlockRank: 'Netrunner' },
  cluster: { name: 'CLUSTER', icon: '✦', color: '#ffffff', desc: 'Split into 3 on first hit', rarity: 'legendary', cost: 450, unlockRank: 'Ghost' },
  explosive: { name: 'EXPLOSIVE', icon: '✸', color: '#ff4400', desc: 'Explode all pegs in radius', rarity: 'uncommon', cost: 125, unlockRank: 'Script Kiddie+' },
  slowmo: { name: 'SLOW-MO', icon: '◐', color: '#4488ff', desc: '50% time dilation', rarity: 'rare', cost: 200, unlockRank: 'Netrunner+' }
};

// ─── PEG DEFINITIONS ────────────────────────────────────────
const PEG_TYPES = {
  node:     { color: '#00f0ff', glow: '#00f0ff', radius: 6, bounce: 0.65, label: 'NODE' },
  ice:      { color: '#ff8800', glow: '#ff8800', radius: 7, bounce: 0.5, label: 'ICE', hazard: true },
  fiber:    { color: '#aa44ff', glow: '#aa44ff', radius: 5, bounce: 0.3, friction: 0.95, label: 'FIBER' },
  mirror:   { color: '#ffffff', glow: '#ffffff', radius: 6, bounce: 0.9, reflect: true, label: 'MIRROR' },
  cache:    { color: '#ffcc00', glow: '#ffcc00', radius: 8, bonus: true, bounce: 0.6, label: 'CACHE' },
  honeypot: { color: '#ff2244', glow: '#ff2244', radius: 9, trap: true, bounce: 0.5, label: 'HONEYPOT' },
  overload: { color: '#ff00aa', glow: '#ff00aa', radius: 7, explosive: true, bounce: 0.7, label: 'OVERLOAD' },
  crumbling:{ color: '#00f0ff', glow: '#00f0ff', radius: 6, bounce: 0.65, label: 'CRUMBLING', crumbling: true },
  seismic:  { color: '#ff00aa', glow: '#ff00aa', radius: 7, bounce: 0.7, label: 'SEISMIC', seismic: true, points: 100 }
};

// ─── PHYSICS CONSTANTS ───────────────────────────────────────
const GRAVITY = 0.18;
const FRICTION = 0.995;
const MAX_VEL = 14;
const BALL_RADIUS = 7;

// ─── BALL CLASS ──────────────────────────────────────────────
class Ball {
  constructor(x, y, vx, vy, payloads = []) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.payloads = [...payloads];
    this.active = true;
    this.trail = [];
    this.hitPegs = new Set();
    this.piercing = false;
    this.cloneSpawned = false;
    // Ghost payload state
    this.ghostPhasing = false;
    this.ghostPhaseRemaining = 0;
    this.ghostSplitTrail = []; // RGB ghost trail
    // Cluster payload state
    this.clusterSplit = false;
    this.miniBalls = [];
    // Explosive payload state
    this.explosiveTriggered = false;
    // Slow-mo payload state
    this.slowmoActive = false;
  }

  update() {
    if (!this.active) return;

    // ── SLOW-MO: 50% time dilation ─────────────────────────
    const timeScale = this.slowmoActive ? 0.5 : 1.0;

    // Gravity (scaled)
    this.vy += GRAVITY * timeScale;

    // Friction
    this.vx *= FRICTION;

    // Velocity cap
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (spd > MAX_VEL) {
      this.vx = (this.vx / spd) * MAX_VEL;
      this.vy = (this.vy / spd) * MAX_VEL;
    }

    // Move (scaled)
    this.x += this.vx * timeScale;
    this.y += this.vy * timeScale;

    // Trail — ghost trail stores RGB separate positions
    this.trail.unshift({ x: this.x, y: this.y, age: 0 });
    if (this.trail.length > 16) this.trail.pop();
    this.trail.forEach(t => t.age++);

    // Ghost RGB split trail
    if (this.ghostPhasing) {
      this.ghostSplitTrail.unshift({
        rx: this.x + 3, gx: this.x, bx: this.x - 3,
        ry: this.y, gy: this.y, by: this.y,
        age: 0
      });
      if (this.ghostSplitTrail.length > 10) this.ghostSplitTrail.pop();
      this.ghostSplitTrail.forEach(t => t.age++);
    } else {
      this.ghostSplitTrail = [];
    }

    // Mini-balls (cluster) — no gravity, no friction: linear trajectory per spec
    for (let i = this.miniBalls.length - 1; i >= 0; i--) {
      const mb = this.miniBalls[i];
      mb.x += mb.vx;
      mb.y += mb.vy;
      mb.trail.unshift({ x: mb.x, y: mb.y, age: 0 });
      if (mb.trail.length > 10) mb.trail.pop();
      mb.trail.forEach(t => t.age++);
      if (mb.y > H + 20) {
        this.miniBalls.splice(i, 1);
      }
    }

    // Wall bounce
    if (this.x < BALL_RADIUS) { this.x = BALL_RADIUS; this.vx *= -0.8; }
    if (this.x > W - BALL_RADIUS) { this.x = W - BALL_RADIUS; this.vx *= -0.8; }

    // Exit bottom
    if (this.y > H + 20) {
      this.active = false;
      resolveBallExit(this);
    }
  }

  draw() {
    if (!this.active) return;

    // ── CLUSTER: draw mini-balls first ─────────────────────
    this.miniBalls.forEach(mb => {
      for (let i = mb.trail.length - 1; i >= 1; i--) {
        const t = mb.trail[i];
        const alpha = (1 - t.age / 15) * 0.6;
        if (alpha > 0) {
          ctx.beginPath();
          ctx.arc(t.x, t.y, 4 * (1 - t.age / 15), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }
      }
      ctx.beginPath();
      ctx.arc(mb.x, mb.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // ── GHOST: RGB chromatic aberration trail ──────────────
    if (this.ghostPhasing) {
      this.ghostSplitTrail.forEach((t, idx) => {
        const alpha = (1 - t.age / 12) * 0.4;
        if (alpha <= 0) return;
        // Red channel
        ctx.beginPath();
        ctx.arc(t.rx, t.ry, BALL_RADIUS * (1 - t.age / 12), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 100, 255, ${alpha})`;
        ctx.fill();
        // Cyan channel
        ctx.beginPath();
        ctx.arc(t.bx, t.by, BALL_RADIUS * (1 - t.age / 12), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 230, 255, ${alpha})`;
        ctx.fill();
      });
    }

    // ── NORMAL BALL / GHOST BALL TRAIL ────────────────────
    for (let i = this.trail.length - 1; i >= 1; i--) {
      const t = this.trail[i];
      const alpha = (1 - t.age / 20) * 0.5;
      const r = BALL_RADIUS * (1 - t.age / 20);
      if (alpha > 0) {
        ctx.beginPath();
        ctx.arc(t.x, t.y, Math.max(1, r), 0, Math.PI * 2);
        ctx.fillStyle = this.ghostPhasing
          ? `rgba(220, 180, 255, ${alpha})`
          : `rgba(0, 240, 255, ${alpha})`;
        ctx.fill();
      }
    }

    // ── MAIN BALL ────────────────────────────────────────
    if (this.ghostPhasing) {
      // Ghost: semi-transparent with shimmer
      ctx.globalAlpha = 0.55 + Math.sin(Date.now() / 80) * 0.15;
      ctx.beginPath();
      ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#cc88ff';
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 20 + Math.sin(Date.now() / 60) * 8;
      ctx.fill();
      // Chromatic aberration core
      ctx.beginPath();
      ctx.arc(this.x + 2, this.y, BALL_RADIUS * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,100,255,0.5)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x - 2, this.y, BALL_RADIUS * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,230,255,0.5)';
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    } else if (this.slowmoActive) {
      // Slow-mo: octagonal/crystalline blue
      ctx.beginPath();
      const sides = 8;
      for (let i = 0; i < sides; i++) {
        const angle = (i / sides) * Math.PI * 2 - Math.PI / 8;
        const bx = this.x + Math.cos(angle) * BALL_RADIUS;
        const by = this.y + Math.sin(angle) * BALL_RADIUS;
        i === 0 ? ctx.moveTo(bx, by) : ctx.lineTo(bx, by);
      }
      ctx.closePath();
      ctx.fillStyle = '#4488ff';
      ctx.shadowColor = '#4488ff';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if (this.explosiveTriggered) {
      // Explosive: charged magenta with crackling lines
      ctx.beginPath();
      ctx.arc(this.x, this.y, BALL_RADIUS + 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ff4400';
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 15;
      ctx.fill();
      // Energy lines
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const angle = Date.now() / 100 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + Math.cos(angle) * (BALL_RADIUS + 6), this.y + Math.sin(angle) * (BALL_RADIUS + 6));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else {
      // Standard ball
      ctx.beginPath();
      ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = this.miniBalls.length > 0 ? '#ffffff' : '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Payload indicators
    if (this.payloads.length > 0) {
      this.payloads.forEach((p, i) => {
        const angle = (Date.now() / 500 + i * Math.PI) % (Math.PI * 2);
        const px = this.x + Math.cos(angle) * 14;
        const py = this.y + Math.sin(angle) * 14;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = PAYLOADS[p] ? PAYLOADS[p].color : '#00f0ff';
        ctx.fill();
      });
    }
  }
}

// ─── PARTICLE SYSTEM ─────────────────────────────────────────
const particles = [];
const fragments = []; // Crumbling peg shards
const shockwaves = []; // Seismic shockwave rings

function spawnParticles(x, y, color, count = 8, spread = 3) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.5) * spread,
      color,
      life: 1,
      decay: 0.03 + Math.random() * 0.02,
      size: 2 + Math.random() * 3
    });
  }
}

function spawnFragments(x, y, color) {
  for (let i = 0; i < 5; i++) {
    fragments.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 2 - 1,
      color,
      life: 1,
      decay: 0.015 + Math.random() * 0.01,
      size: 3 + Math.random() * 4,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2
    });
  }
}

function spawnShockwave(x, y) {
  shockwaves.push({ x, y, radius: 10, maxRadius: 80, life: 1, decay: 0.04 });
}

function updateFragments() {
  for (let i = fragments.length - 1; i >= 0; i--) {
    const f = fragments[i];
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.15; // gravity
    f.life -= f.decay;
    f.rotation += f.rotSpeed;
    if (f.life <= 0) fragments.splice(i, 1);
  }
}

function updateShockwaves() {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * 0.15;
    s.life -= s.decay;
    if (s.life <= 0) shockwaves.splice(i, 1);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawFragments() {
  fragments.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rotation);
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 4;
    // Draw irregular shard shape
    ctx.beginPath();
    ctx.moveTo(-f.size * 0.5, -f.size * 0.3);
    ctx.lineTo(f.size * 0.3, -f.size * 0.5);
    ctx.lineTo(f.size * 0.5, f.size * 0.2);
    ctx.lineTo(0, f.size * 0.5);
    ctx.lineTo(-f.size * 0.4, f.size * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();
  });
}

function drawShockwaves() {
  shockwaves.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#ff00aa';
    ctx.lineWidth = 3 * s.life;
    ctx.globalAlpha = s.life * 0.7;
    ctx.shadowColor = '#ff00aa';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

// ─── FLOATING TEXT ───────────────────────────────────────────
const floatTexts = [];

function spawnFloatText(x, y, text, color = '#00f0ff') {
  floatTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

function updateFloatTexts() {
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i];
    t.y += t.vy;
    t.life -= 0.02;
    if (t.life <= 0) floatTexts.splice(i, 1);
  }
}

function drawFloatTexts() {
  floatTexts.forEach(t => {
    ctx.globalAlpha = t.life;
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = t.color;
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });
}

// ─── BOARD GENERATION ───────────────────────────────────────
function generateBoard(floor) {
  const board = [];

  if (floor <= 2) {
    // Simple grid, generous spacing
    for (let row = 0; row < 8; row++) {
      const cols = 7 - (row % 2);
      const y = 120 + row * 55;
      const offset = (row % 2) === 0 ? 0 : 30;
      for (let col = 0; col < cols; col++) {
        const x = 50 + offset + col * 60;
        const r = Math.random();
        let type = 'node';
        if (r < 0.12) type = 'ice';
        if (floor >= 2 && r < 0.08) type = 'crumbling';
        board.push({ x, y, type, hitCount: 0, id: board.length,
          hitsRemaining: type === 'crumbling' ? 1 + Math.floor(Math.random() * 3) : 0,
          crumblingColor: type === 'crumbling' ? ['#00f0ff','#aa44ff','#ffcc00'][Math.floor(Math.random() * 3)] : null
        });
      }
    }
    // Cache pegs
    for (let i = 0; i < 4; i++) {
      board.push({
        x: 80 + Math.random() * 320,
        y: 150 + Math.random() * 300,
        type: 'cache',
        hitCount: 0, id: board.length
      });
    }
  } else if (floor <= 4) {
    // Tighter, hazards
    for (let row = 0; row < 10; row++) {
      const cols = 8 - (row % 2);
      const y = 100 + row * 48;
      const offset = (row % 2) === 0 ? 0 : 25;
      for (let col = 0; col < cols; col++) {
        const x = 40 + offset + col * 50;
        const r = Math.random();
        let type = 'node';
        if (r < 0.10) type = 'ice';
        else if (r < 0.16) type = 'fiber';
        else if (r < 0.20) type = 'mirror';
        else if (r < 0.23) type = 'honeypot';
        else if (r < 0.26) type = 'overload';
        else if (r < 0.20 + (floor === 4 ? 0.08 : 0.04)) type = 'crumbling';
        else if (r < 0.26 + (floor === 4 ? 0.06 : 0.03)) type = 'seismic';
        board.push({ x, y, type, hitCount: 0, id: board.length,
          hitsRemaining: type === 'crumbling' ? 1 + Math.floor(Math.random() * 3) : 0,
          crumblingColor: type === 'crumbling' ? ['#00f0ff','#aa44ff','#ffcc00'][Math.floor(Math.random() * 3)] : null
        });
      }
    }
    for (let i = 0; i < 5; i++) {
      board.push({
        x: 60 + Math.random() * 360,
        y: 130 + Math.random() * 320,
        type: 'cache',
        hitCount: 0, id: board.length
      });
    }
  } else {
    // Floor 5: Boss vault
    // Vault target at bottom
    board.push({ x: W/2, y: H - 120, type: 'cache', boss: true, hits: 0, maxHits: 15, hitCount: 0, id: board.length });
    // Obstacle pegs
    for (let row = 0; row < 8; row++) {
      const cols = 6 - (row % 2);
      const y = 100 + row * 50;
      const offset = (row % 2) === 0 ? 0 : 30;
      for (let col = 0; col < cols; col++) {
        const x = 50 + offset + col * 65;
        const r = Math.random();
        let type = 'node';
        if (r < 0.12) type = 'ice';
        else if (r < 0.18) type = 'overload';
        else if (r < 0.22) type = 'honeypot';
        else if (r < 0.27) type = 'crumbling';
        else if (r < 0.32) type = 'seismic';
        board.push({ x, y, type, hitCount: 0, id: board.length,
          hitsRemaining: type === 'crumbling' ? 1 + Math.floor(Math.random() * 3) : 0,
          crumblingColor: type === 'crumbling' ? ['#00f0ff','#aa44ff','#ffcc00'][Math.floor(Math.random() * 3)] : null
        });
      }
    }
  }

  return board;
}

// ─── OBJECTIVE SETUP ─────────────────────────────────────────
function setupObjective(floor) {
  switch (floor) {
    case 1: return { type: 'standard', target: 20, progress: 0, label: 'CLEAR 20 PEGS' };
    case 2: return { type: 'standard', target: 30, progress: 0, label: 'CLEAR 30 PEGS' };
    case 3: return { type: 'ghost', target: 0, progress: 0, label: 'GHOST MODE - NO ICE HITS' };
    case 4: return { type: 'standard', target: 35, progress: 0, label: 'CLEAR 35 PEGS' };
    case 5: return { type: 'boss', target: 15, progress: 0, label: 'CRACK THE VAULT' };
  }
}

// ─── COLLISION DETECTION ─────────────────────────────────────
function checkCollisions() {
  for (const ball of GS.ballsInPlay) {
    if (!ball.active) continue;

    for (const peg of GS.board) {
      if (ball.hitPegs.has(peg.id)) continue;
      if (peg.destroyed) continue;

      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const pegR = PEG_TYPES[peg.type].radius;
      const minDist = BALL_RADIUS + pegR;

      if (dist < minDist) {
        // Collision!
        handlePegHit(ball, peg, dx, dy, dist, minDist);
      }
    }
  }
}

function handlePegHit(ball, peg, dx, dy, dist, minDist) {
  const pegDef = PEG_TYPES[peg.type];
  ball.hitPegs.add(peg.id);

  // Normalize collision vector
  const nx = dx / dist;
  const ny = dy / dist;

  // Separate ball from peg
  const overlap = minDist - dist;
  ball.x += nx * overlap;
  ball.y += ny * overlap;

  // Bounce velocity
  const dot = ball.vx * nx + ball.vy * ny;
  const bounce = pegDef.bounce || 0.65;

  // ── GHOST PAYLOAD: phase through pegs without bounce ─────
  if (ball.ghostPhasing && ball.ghostPhaseRemaining > 0) {
    ball.ghostPhaseRemaining--;
    spawnParticles(peg.x, peg.y, '#ff88ff', 6, 2);
    spawnFloatText(peg.x, peg.y - 8, `PHASE ${ball.ghostPhaseRemaining}`, '#cc88ff');
    if (ball.ghostPhaseRemaining === 0) {
      // Solidify
      ball.ghostPhasing = false;
      triggerFlash('#ffffff44', 0.2);
      spawnFloatText(ball.x, ball.y - 15, 'SOLIDIFY', '#ffffff');
    }
    // Phase through — no bounce, just visual contact feedback
    GS.comboCount++;
    checkFrenzy();
    // Still increment score/progress for peg contact
    GS.score += (pegDef.bonus ? 200 : 50) * GS.multiplier;
    GS.floorObjective.progress++;
    GS.totalPegsCleared++;
    GS.chainTimer = 30;
    GS.multiplier = Math.min(7, GS.multiplier + 1);
    updateMultiplierDisplay();
    peg.hitCount++;
    updateHUD();
    updateObjectiveBar();
    return; // skip normal bounce
  }

  if (pegDef.reflect) {
    // Mirror: reflect across surface
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    ball.vx *= bounce;
    ball.vy *= bounce;
  } else if (pegDef.friction) {
    // Fiber: slide along
    ball.vx *= pegDef.friction;
    ball.vy = ball.vy * 0.5 + Math.abs(ball.vy) * 0.5;
  } else {
    // Normal bounce
    ball.vx -= (1 + bounce) * dot * nx;
    ball.vy -= (1 + bounce) * dot * ny;
  }

  // Apply worm (pierce) payload
  if (ball.piercing) {
    ball.vx += nx * 2;
    ball.vy += ny * 2;
  }

  // Effects based on peg type
  peg.hitCount++;
  spawnParticles(peg.x, peg.y, peg.crumblingColor || pegDef.color, 10, 4);

  // Scoring
  const baseScore = pegDef.bonus ? 200 : 50;
  GS.score += baseScore * GS.multiplier;
  GS.floorObjective.progress++;
  GS.totalPegsCleared++;

  // Payload effects on peg contact
  if (ball.payloads.length > 0) {
    for (const payload of ball.payloads) {
      switch (payload) {
        case 'cluster':
          if (!ball.clusterSplit) {
            ball.clusterSplit = true;
            const baseAngle = Math.atan2(ball.vy, ball.vx);
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 1.3;
            const angles = [baseAngle - 0.5, baseAngle, baseAngle + 0.5];
            angles.forEach(angle => {
              ball.miniBalls.push({
                x: ball.x, y: ball.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                trail: [], active: true
              });
            });
            spawnParticles(ball.x, ball.y, '#ffffff', 15, 6);
            spawnFloatText(ball.x, ball.y - 15, 'CLUSTER!', '#ffffff');
            triggerFlash('#ffffff33', 0.15);
          }
          break;
        case 'explosive':
          if (!ball.explosiveTriggered) {
            ball.explosiveTriggered = true;
            triggerFlash('#ff440033', 0.2);
            triggerShake(8);
            spawnFloatText(ball.x, ball.y, 'BOOM!', '#ff4400');
            for (const other of GS.board) {
              if (other.destroyed) continue;
              const edx = other.x - ball.x;
              const edy = other.y - ball.y;
              const eDist = Math.sqrt(edx * edx + edy * edy);
              if (eDist < 80) {
                other.destroyed = true;
                GS.floorObjective.progress++;
                spawnParticles(other.x, other.y, PEG_TYPES[other.type].color, 8, 3);
                GS.score += 50;
              }
            }
            for (let i = 0; i < 12; i++) {
              const angle = (i / 12) * Math.PI * 2;
              particles.push({
                x: ball.x, y: ball.y,
                vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6,
                color: '#ff4400', life: 1, decay: 0.05, size: 4
              });
            }
          }
          break;
        case 'slowmo':
          if (ball.slowmoActive) {
            ball.slowmoActive = false;
            GS.slowmoBall = null;
            GS.timeScale = 1.0;
            spawnFloatText(ball.x, ball.y - 15, 'SLOW-MO END', '#4488ff');
          }
          break;
      }
    }
  }

  // Chain multiplier
  GS.chainTimer = 30; // ~0.5s at 60fps
  GS.multiplier = Math.min(7, GS.multiplier + 1);
  GS.runMaxCombo = Math.max(GS.runMaxCombo || 0, GS.comboCount);
  updateMultiplierDisplay();

  // Frenzy combo counter
  GS.comboCount++;
  checkFrenzy();

  // Multiplier text
  if (GS.multiplier > 1) {
    spawnFloatText(peg.x, peg.y - 10, `x${GS.multiplier}`, '#ff00aa');
  }

  // Peg-specific effects
  if (pegDef.hazard && pegDef.label === 'ICE') {
    if (peg.hitCount >= 3) {
      // Lose a ball
      triggerHoneypotEffect();
      spawnFloatText(peg.x, peg.y, 'ICE TRIP', '#ff8800');
    }
    triggerFlash('#ff880044', 0.1);
  }

  if (pegDef.bonus) {
    GS.breachCredits += 10 * GS.multiplier;
    spawnFloatText(peg.x, peg.y, `+${10 * GS.multiplier}`, '#ffcc00');
    triggerFlash('#ffcc0033', 0.1);
  }

  if (pegDef.trap) {
    // Honeypot: end ball, steal payload
    triggerHoneypotEffect();
    if (ball.payloads.length > 0) {
      ball.payloads.pop(); // steal last payload
    }
    ball.active = false;
    spawnFloatText(peg.x, peg.y, 'HONEYPOT!', '#ff2244');
    return;
  }

  if (pegDef.explosive) {
    // Overload: chain explosion
    triggerFlash('#ff00aa22', 0.15);
    triggerShake(4);
    spawnFloatText(peg.x, peg.y, 'OVERLOAD!', '#ff00aa');
    // Damage nearby pegs
    for (const other of GS.board) {
      if (other === peg || other.destroyed) continue;
      const edx = other.x - peg.x;
      const edy = other.y - peg.y;
      const eDist = Math.sqrt(edx*edx + edy*edy);
      if (eDist < 60) {
        other.destroyed = true;
        GS.floorObjective.progress += 2;
        spawnParticles(other.x, other.y, PEG_TYPES[other.type].color, 6, 2);
      }
    }
    peg.destroyed = true;
  }

  // Boss peg
  if (peg.boss) {
    peg.hits = (peg.hits || 0) + 1;
    GS.floorObjective.progress = peg.hits;
    triggerFlash('#ffcc0033', 0.15);
    spawnFloatText(peg.x, peg.y, `VAULT ${peg.hits}/${peg.maxHits}`, '#ffcc00');
    if (peg.hits >= peg.maxHits) {
      peg.destroyed = true;
      GS.floorObjective.progress = peg.maxHits;
      triggerFullBreach();
    }
  }

  // ── CRUMBLING PEG ──────────────────────────────────────────
  if (pegDef.crumbling) {
    peg.hitsRemaining--;
    if (peg.hitsRemaining <= 0) {
      peg.destroyed = true;
      spawnFragments(peg.x, peg.y, peg.crumblingColor || pegDef.color);
      spawnFloatText(peg.x, peg.y, 'SHATTER!', peg.crumblingColor || pegDef.color);
      // Score and progress were already awarded at peg contact — keep them
    } else {
      // Critical hit indicator on 1-hit remaining
      if (peg.hitsRemaining === 1) {
        spawnFloatText(peg.x, peg.y - 12, 'CRITICAL!', peg.crumblingColor || pegDef.color);
      }
    }
  }

  // ── SEISMIC PEG ────────────────────────────────────────────
  if (pegDef.seismic) {
    triggerShake(6);
    triggerFlash('#ff00aa22', 0.15);
    spawnShockwave(peg.x, peg.y);
    spawnParticles(peg.x, peg.y, '#ff00aa', 20, 5); // 2x spark burst
    GS.score += 100 * GS.multiplier; // flat +100 bonus
    spawnFloatText(peg.x, peg.y, '+100', '#ff00aa');
  }
}

function resolveBallExit(ball) {
  // Logic bomb: explode all nearby pegs
  if (ball.payloads.includes('logicbomb')) {
    triggerFlash('#ffaa0033', 0.2);
    triggerShake(6);
    spawnFloatText(ball.x, ball.y, 'LOGIC BOMB!', '#ffaa00');
    for (const peg of GS.board) {
      if (peg.destroyed) continue;
      const dx = peg.x - ball.x;
      const dy = peg.y - ball.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 80) {
        peg.destroyed = true;
        GS.floorObjective.progress += 2;
        spawnParticles(peg.x, peg.y, PEGLOADS[peg.type].color || '#ffaa00', 8, 3);
      }
    }
  }

  // Daemon split check (already handled in update via clones)
  if (!ball.active && GS.ballsInPlay.filter(b => b.active).length === 0) {
    // All balls done
    GS.multiplier = 1;
    GS.multiplierTimer = 0;
    updateMultiplierDisplay();
  }
}

function triggerHoneypotEffect() {
  // Screen invert flash
  document.getElementById('game-container').style.filter = 'invert(1) hue-rotate(180deg)';
  setTimeout(() => {
    document.getElementById('game-container').style.filter = '';
  }, 150);
}

function triggerFullBreach() {
  triggerFlash('#00ffaa44', 0.5);
  triggerShake(8);
  spawnFloatText(W/2, H/2, 'VAULT CRACKED!', '#00ffaa');
}

// ─── BALL DROP ───────────────────────────────────────────────
let canDrop = true;
let dropX = W / 2;

function dropBall() {
  if (!canDrop || GS.screen !== 'playing' || GS.balls <= 0) return;
  if (GS.ballsInPlay.length > 0 && GS.ballsInPlay.some(b => b.active)) return;

  canDrop = false;
  GS.balls--;
  GS.totalBallsUsed++;

  const ball = new Ball(dropX, 70, (Math.random() - 0.5) * 2, 1, [...GS.currentPayloads]);
  GS.ballsInPlay = [ball];

  // Initialize Slot Protocol 2.0 payload states
  GS.comboCount = 0;
  for (const p of GS.currentPayloads) {
    if (p === 'ghost') {
      ball.ghostPhasing = true;
      ball.ghostPhaseRemaining = 3 + Math.floor(Math.random() * 3); // 3-5 phases
    }
    if (p === 'slowmo') {
      ball.slowmoActive = true;
      GS.slowmoBall = ball;
      GS.timeScale = 0.5;
    }
    if (p === 'cluster') {
      ball.clusterSplit = false;
      ball.miniBalls = [];
    }
    if (p === 'explosive') {
      ball.explosiveTriggered = false;
    }
  }

  // Clear payloads after use
  GS.currentPayloads = [];
  GS.runMaxCombo = 0;
  updatePayloadSlots();
  updateHUD();

  setTimeout(() => { canDrop = true; }, 800);
}

// ─── MULTIPLIER ──────────────────────────────────────────────
function updateMultiplierDisplay() {
  const el = document.getElementById('multiplier-display');
  el.textContent = `x${GS.multiplier}`;
  el.classList.toggle('show', GS.multiplier > 1);
  el.classList.toggle('xhigh', GS.multiplier >= 4);
  el.classList.toggle('xmax', GS.multiplier >= 6);
  if (GS.multiplier > 1) {
    el.style.animation = 'none';
    el.offsetHeight; // reflow to restart animation
    el.style.animation = '';
  }
}

// ─── HUD UPDATE ──────────────────────────────────────────────
function updateHUD() {
  document.getElementById('floor-indicator').textContent = `${GS.floor}/5`;
  document.getElementById('score-value').textContent = GS.score.toLocaleString();

  // Balls display
  const ballsEl = document.getElementById('balls-display');
  ballsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'ball-dot' + (i >= GS.balls ? ' empty' : '');
    ballsEl.appendChild(dot);
  }

  // Combo counter (Slot Protocol 2.0)
  let comboEl = document.getElementById('combo-display');
  if (!comboEl) {
    comboEl = document.createElement('div');
    comboEl.id = 'combo-display';
    comboEl.style.cssText = 'position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:#ff00aa;z-index:20;letter-spacing:2px;text-shadow:0 0 10px #ff00aa,0 0 20px #ff00aa55;padding:4px 12px;border:1px solid #ff00aa44;border-radius:20px;background:#0a0010aa;';
    document.getElementById('game-container').appendChild(comboEl);
  }
  const comboPct = GS.comboThreshold > 0 ? Math.min(100, (GS.comboCount / GS.comboThreshold) * 100) : 0;
  comboEl.innerHTML = `<span style="color:#ffffff;font-size:11px;">⬡</span> <span style="color:#ffffff;font-size:15px;font-weight:900;">${GS.comboCount}</span><span style="color:#666;font-size:11px;">/${GS.comboThreshold}</span>` + (GS.frenzyReady ? ` <span style="color:#ffd700;font-weight:900;animation:frenzyTextPulse 0.6s ease-in-out infinite alternate;">✦ FRENZY! ✦</span>` : '');

  // Frenzy border pulse
  const gc = document.getElementById('game-container');
  if (GS.frenzyActive) {
    gc.style.boxShadow = '0 0 30px rgba(255,0,170,0.6), inset 0 0 30px rgba(255,0,170,0.1)';
  } else {
    gc.style.boxShadow = '';
  }
}

function checkFrenzy() {
  if (GS.comboCount >= GS.comboThreshold && !GS.frenzyReady) {
    GS.frenzyReady = true;
    spawnFloatText(W / 2, H / 2, 'FRENZY READY!', '#ff00aa');
    triggerFlash('#ff00aa33', 0.3);
  }
}

function updateObjectiveBar() {
  const obj = GS.floorObjective;
  const pct = obj.target > 0 ? Math.min(100, (obj.progress / obj.target) * 100) : 0;
  document.getElementById('objective-fill').style.width = pct + '%';
  document.getElementById('objective-label').textContent = obj.label;

  // Check completion
  if (obj.progress >= obj.target && GS.screen === 'playing') {
    completeFloor();
  }
}

function updatePayloadSlots() {
  for (let i = 0; i < 2; i++) {
    const slot = document.getElementById(`payload-slot-${i}`);
    if (GS.currentPayloads[i]) {
      const p = PAYLOADS[GS.currentPayloads[i]];
      slot.textContent = p.icon;
      slot.className = 'payload-slot active';
      slot.style.borderColor = p.color;
      slot.style.color = p.color;
    } else {
      slot.textContent = '—';
      slot.className = 'payload-slot';
      slot.style.borderColor = '';
      slot.style.color = '';
    }
  }
}

function updateMenuStats() {
  document.getElementById('menu-rank').textContent = GS.rank;
  document.getElementById('menu-rep').textContent = GS.reputation;
  document.getElementById('menu-breach').textContent = PERSIST.lifetimeBreach.toLocaleString();
}

// ─── FLOOR COMPLETION ─────────────────────────────────────────
function completeFloor() {
  GS.screen = 'floor_complete';

  const creditGain = 50 + (GS.floor * 20) + (GS.multiplier * 10);
  GS.breachCredits += creditGain;

  const title = document.getElementById('floor-complete-title');
  const stats = document.getElementById('floor-stats');

  if (GS.floor === 5) {
    title.textContent = '◆ FULL BREACH ◆';
    title.style.color = '#00ffaa';
    triggerFlash('#00ffaa44', 0.6);
  } else {
    title.textContent = `FLOOR ${GS.floor} BREACHED`;
    title.style.color = '#00ffaa';
    triggerFlash('#00ffaa33', 0.4);
  }

  stats.innerHTML = `
    <div>PEG CLEARED: <span class="floor-stat-value">${GS.totalPegsCleared}</span></div>
    <div>BALLS USED: <span class="floor-stat-value">${GS.totalBallsUsed}</span></div>
    <div>CREDITS EARNED: <span class="floor-stat-value">+${creditGain}</span></div>
  `;

  document.getElementById('floor-overlay').classList.add('active');

  // ── JACKPOT SLOT MACHINE ─────────────────────────────────
  // Use MutationObserver to handle timing for overlay activation
  if (!window._jpObserver) {
    window._jpObserver = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'attributes' && m.attributeName === 'class') {
          const overlay = document.getElementById('floor-overlay');
          if (overlay && overlay.classList.contains('active')) {
            initJackpotSlots();
          }
        }
      }
    });
    window._jpObserver.observe(document.getElementById('floor-overlay'), { attributes: true });
  }
}

function initJackpotSlots() {
  const reels = [
    document.getElementById('reel-0'),
    document.getElementById('reel-1'),
    document.getElementById('reel-2')
  ];
  const jpBanner = document.getElementById('jp-banner');
  const jpBtn = document.getElementById('jp-spin-btn');
  const jpContinueBtn = document.getElementById('jp-continue-btn');
  const jpRerollBtn = document.getElementById('jp-reroll-btn') || (() => {
    const btn = document.createElement('button');
    btn.id = 'jp-reroll-btn';
    btn.className = 'game-btn secondary';
    btn.style.cssText = 'font-size:11px;padding:6px 16px;display:none;';
    jpContinueBtn.parentNode.insertBefore(btn, jpContinueBtn);
    return btn;
  })();

  const symbols = ['☠','☢','✦','◈','✧'];
  let spinInProgress = false;
  let canReroll = false;

  reels.forEach(r => r && (r.textContent = symbols[Math.floor(Math.random() * symbols.length)]));
  if (jpBanner) { jpBanner.style.display = 'none'; jpBanner.textContent = ''; }
  if (jpContinueBtn) jpContinueBtn.style.display = 'none';
  if (jpRerollBtn) jpRerollBtn.style.display = 'none';

  // Show pulsing "SPIN TO WIN!" prompt
  let promptEl = document.getElementById('jp-prompt');
  if (!promptEl) {
    promptEl = document.createElement('div');
    promptEl.id = 'jp-prompt';
    promptEl.style.cssText = 'text-align:center;font-size:14px;font-weight:bold;color:#ffd700;' +
      'text-shadow:0 0 12px #ffd700;animation:jpPromptPulse 1s ease-in-out infinite alternate;';
    jpBtn.parentNode.insertBefore(promptEl, jpBtn);
  }
  promptEl.textContent = '★ SPIN TO WIN! ★';
  promptEl.style.display = 'block';

  function showResult() {
    const [a, b, c] = reels.map(r => r.textContent);
    const mult = GS.frenzyReady ? 3 : 1;
    GS.frenzyReady = false;
    if (a === b && b === c) {
      const bonus = 500 * GS.floor * mult;
      GS.breachCredits += Math.floor(bonus / 10);
      if (jpBanner) {
        jpBanner.style.cssText = 'display:block;text-align:center;font-size:18px;color:#ffd700;font-weight:bold;' +
          'text-shadow:0 0 20px #ffd700,2px 2px 0 #ff6600;-webkit-text-stroke:1px #ff6600;' +
          'animation:jpGlitch 0.3s ease-in-out 3 alternate;';
        jpBanner.innerHTML = mult > 1 ? `JACKPOT! +${bonus} x${mult} FRENZY!` : `JACKPOT! +${bonus}`;
      }
      triggerFlash('#ffd70066', 0.5);
      spawnParticles(W/2, H/2, '#ffd700', 30, 8);
      if (jpContinueBtn) jpContinueBtn.style.display = 'inline-block';
      canReroll = false;
    } else if (a === b || b === c) {
      const minor = 100 * GS.floor * mult;
      GS.breachCredits += Math.floor(minor / 10);
      if (jpBanner) {
        jpBanner.style.cssText = 'display:block;text-align:center;font-size:20px;color:#aaaaff;font-weight:bold;' +
          'text-shadow:0 0 15px #aaaaff,0 0 30px #aaaaff66;-webkit-text-stroke:1px #6666ff;' +
          'animation:jpGlitch 0.4s ease-in-out 2 alternate;';
        jpBanner.innerHTML = mult > 1 ? `◆ CLOSE! ◆ +${minor} x${mult} FRENZY!` : `◆ CLOSE! ◆ +${minor}`;
      }
      triggerFlash('#aaaaff66', 0.4);
      spawnParticles(W/2, H/2, '#aaaaff', 15, 5);
      if (jpContinueBtn) jpContinueBtn.style.display = 'inline-block';
      canReroll = false;
    } else {
      // No match — offer one re-roll
      if (canReroll) {
        canReroll = false;
        if (jpContinueBtn) jpContinueBtn.style.display = 'inline-block';
      } else {
        canReroll = true;
        if (jpRerollBtn) {
          jpRerollBtn.style.display = 'inline-block';
          jpRerollBtn.textContent = 'SPIN AGAIN';
        }
      }
    }
  }

  function doSpin() {
    if (spinInProgress) return;
    spinInProgress = true;
    if (jpBtn) jpBtn.style.display = 'none';
    if (promptEl) promptEl.style.display = 'none';
    if (jpRerollBtn) jpRerollBtn.style.display = 'none';
    const spinDurations = [1200, 1800, 2400];
    reels.forEach((reel, i) => {
      let count = 0;
      const spin = setInterval(() => {
        reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        count++;
        if (count > 8 + i * 4) {
          clearInterval(spin);
          reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        }
      }, 60 + i * 30);
      setTimeout(() => {
        clearInterval(spin);
        reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      }, spinDurations[i]);
    });
    setTimeout(() => {
      spinInProgress = false;
      showResult();
    }, spinDurations[2] + 200);
  }

  if (jpBtn) {
    jpBtn.style.display = 'inline-block';
    jpBtn.onclick = doSpin;
  }

  if (jpRerollBtn) {
    jpRerollBtn.onclick = doSpin;
  }
}

// ─── SHOP ────────────────────────────────────────────────────
const SHOP_ITEMS = [
  { id: 'scrambler', type: 'payload', name: 'SCRAMBLER', icon: '◎', cost: 50, desc: 'Reverses ball direction on hit' },
  { id: 'trojan', type: 'payload', name: 'TROJAN', icon: '◈', cost: 100, desc: 'Spawns 2 clone balls on hit' },
  { id: 'worm', type: 'payload', name: 'WORM', icon: '≡', cost: 200, desc: 'Ball pierces through pegs' },
  { id: 'logicbomb', type: 'payload', name: 'LOGIC BOMB', icon: '✷', cost: 250, desc: 'Explodes nearby pegs on exit' },
  { id: 'daemon', type: 'payload', name: 'DAEMON', icon: '✺', cost: 500, desc: 'Ball splits into 3 on impact' },
  { id: 'ghost', type: 'payload', name: 'GHOST BALL', icon: '👻', cost: 300, desc: 'Phase through pegs — no bounce' },
  { id: 'cluster', type: 'payload', name: 'CLUSTER BALL', icon: '✦', cost: 350, desc: 'Splits into 3 balls on first hit' },
  { id: 'explosive', type: 'payload', name: 'EXPLOSIVE', icon: '💥', cost: 400, desc: 'Explodes all nearby pegs on hit' },
  { id: 'slowmo', type: 'payload', name: 'SLOW-MO', icon: '⏱', cost: 250, desc: 'Time slows — ball exits slow' },
  { id: 'extralife', type: 'upgrade', name: 'EXTRA BALL', icon: '●', cost: 300, desc: '+1 starting ball each run' },
  { id: 'multiball', type: 'upgrade', name: 'MULTI-DROP', icon: '●●', cost: 400, desc: 'Drop 2 balls at once' },
  { id: 'creditbonus', type: 'upgrade', name: 'DATA VAMP', icon: '◁', cost: 350, desc: '+25% credits from caches' }
];

function openShop() {
  GS.screen = 'shop';
  document.getElementById('shop-credits').textContent = GS.breachCredits;

  const grid = document.getElementById('shop-grid');
  grid.innerHTML = '';

  for (const item of SHOP_ITEMS) {
    const owned = GS.unlockedPayloads.includes(item.id) || GS.unlockedUpgrades.includes(item.id);
    const canAfford = GS.breachCredits >= item.cost;
    const payloadDef = item.type === 'payload' ? PAYLOADS[item.id] : null;
    const lockedRank = payloadDef?.unlockRank;
    const rankLocked = lockedRank && !GS.unlockedPayloads.includes(item.id) && !GS.unlockedUpgrades.includes(item.id);
    const rankMet = !lockedRank || (GS.rank && GS.rank >= lockedRank.replace('+',''));

    const el = document.createElement('div');
    el.className = 'shop-item' + (owned ? ' owned' : '') + (rankLocked && !rankMet ? ' locked' : '');

    el.innerHTML = `
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}${rankLocked && !rankMet ? ' 🔒' : ''}</div>
      <div class="item-desc">${item.desc}</div>
      ${owned
        ? '<div class="item-owned-badge">✓ OWNED</div>'
        : rankLocked && !rankMet
          ? `<div class="item-cost" style="font-size:9px;color:#666;">Requires: ${lockedRank}</div>`
          : `<div class="item-cost">◈ ${item.cost}</div>
           <button class="shop-buy-btn" ${canAfford ? '' : 'disabled'} data-id="${item.id}">BUY</button>`
      }
    `;

    grid.appendChild(el);
  }

  document.getElementById('shop-overlay').classList.add('active');

  // Bind buy buttons
  grid.querySelectorAll('.shop-buy-btn').forEach(btn => {
    btn.onclick = () => buyItem(btn.dataset.id);
  });
}

function buyItem(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  if (!item || GS.breachCredits < item.cost) return;
  if (GS.unlockedPayloads.includes(id) || GS.unlockedUpgrades.includes(id)) return;

  // Enforce rank unlock
  const payloadDef = item.type === 'payload' ? PAYLOADS[id] : null;
  const lockedRank = payloadDef?.unlockRank;
  const rankMet = !lockedRank || (GS.rank && GS.rank >= lockedRank.replace('+',''));
  if (lockedRank && !rankMet) return;

  GS.breachCredits -= item.cost;
  document.getElementById('shop-credits').textContent = GS.breachCredits;

  if (item.type === 'payload') {
    GS.unlockedPayloads.push(id);
  } else {
    GS.unlockedUpgrades.push(id);
  }

  triggerFlash('#00f0ff33', 0.2);
  openShop(); // Refresh
}

function closeShop() {
  document.getElementById('shop-overlay').classList.remove('active');
  GS.screen = 'playing';
  startNextFloor();
}

// ─── GAME FLOW ────────────────────────────────────────────────
function startNextFloor() {
  GS.floor++;
  if (GS.floor > 5) {
    endRun(true);
    return;
  }

  startFloor();
}

function startFloor() {
  GS.board = generateBoard(GS.floor);
  GS.floorObjective = setupObjective(GS.floor);
  GS.ballsInPlay = [];
  GS.pegsHit = new Set();
  GS.multiplier = 1;
  GS.multiplierTimer = 0;
  GS.chainTimer = 0;
  GS.currentPayloads = [];
  GS.totalPegsCleared = 0;
  GS.totalBallsUsed = 0;
  canDrop = true;

  // Reset ball count if extra life upgrade
  if (GS.floor === 1 && GS.unlockedUpgrades.includes('extralife')) {
    GS.balls = 6;
  } else if (GS.floor === 1) {
    GS.balls = 5;
  }

  // Grant random payload for this run
  if (GS.floor === 1 && GS.payloadInventory.length === 0) {
    grantStartingPayload();
  }

  updateHUD();
  updateObjectiveBar();
  updatePayloadSlots();
}

function grantStartingPayload() {
  const unlocked = GS.unlockedPayloads;
  if (unlocked.length === 0) return;

  // Pick a random unlocked payload
  const pick = unlocked[Math.floor(Math.random() * unlocked.length)];
  GS.currentPayloads = [pick];
  updatePayloadSlots();
}

function getNextRank() {
  const ranks = ['Script Kiddie','Script Kiddie+','Netrunner','Netrunner+','Ghost','Phantom','Legend'];
  const idx = ranks.indexOf(GS.rank);
  return idx >= 0 && idx < ranks.length - 1 ? ranks[idx + 1] : 'MAX';
}
function getRankProgress() {
  const thresholds = [0, 500, 1500, 4000, 10000, 25000, 60000];
  const ranks = ['Script Kiddie','Script Kiddie+','Netrunner','Netrunner+','Ghost','Phantom','Legend'];
  const idx = ranks.indexOf(GS.rank);
  const next = idx >= 0 ? (thresholds[idx + 1] || 999999) : 999999;
  const prev = idx > 0 ? (thresholds[idx] || 0) : 0;
  const rep = GS.reputation || 0;
  if (rep >= next) return 100;
  return Math.min(100, Math.round(((rep - prev) / (next - prev)) * 100));
}

function endRun(won) {
  GS.screen = 'run_end';

  // Convert remaining breach credits to reputation
  const creditGain = Math.floor(GS.breachCredits * (1 + GS.balls * 0.1));
  GS.reputation += creditGain;

  const title = document.getElementById('runend-title');
  const stats = document.getElementById('runend-stats');

  title.textContent = won ? '◆ BREACH COMPLETE ◆' : 'CONNECTION LOST';
  title.className = 'runend-title ' + (won ? 'win' : 'lose');

  stats.innerHTML = `
    <div>FLOOR REACHED: <span class="runend-stat-value">${GS.floor}/5</span></div>
    <div>TOTAL SCORE: <span class="runend-stat-value">${GS.score.toLocaleString()}</span></div>
    <div>PEG CLEARED: <span class="runend-stat-value">${GS.totalPegsCleared}</span></div>
    <div>BEST COMBO: <span class="runend-stat-value">${GS.runMaxCombo || 0} hits</span></div>
    <div>CREDITS EARNED: <span class="runend-stat-value" style="color:#00f0ff;">+${creditGain}</span></div>
    <div class="rank-progress-wrap" style="margin-top:12px;text-align:center;">
      <div style="font-size:11px;color:#666;margin-bottom:6px;">RANK: ${GS.rank} → ${getNextRank()}</div>
      <div style="background:#111;border:1px solid #333;border-radius:8px;height:10px;overflow:hidden;">
        <div style="height:100%;width:${getRankProgress()}%;background:linear-gradient(90deg,#00f0ff,#ff00aa);border-radius:8px;transition:width 0.5s;"></div>
      </div>
      <div style="font-size:10px;color:#555;margin-top:4px;">${getRankProgress()}% to ${getNextRank()}</div>
    </div>
    <div>REPUTATION: <span class="runend-stat-value">+${creditGain}</span></div>
  `;

  PERSIST.lifetimeBreach += GS.score;
  savePersist();

  document.getElementById('runend-overlay').classList.add('active');
}

function startNewRun() {
  GS.floor = 1;
  GS.score = 0;
  GS.breachCredits = 0;
  GS.balls = 5;
  GS.ballsInPlay = [];
  GS.multiplier = 1;
  GS.currentPayloads = [];
  GS.board = [];
  GS.pegsHit = new Set();
  GS.payloadInventory = [];
  GS.totalPegsCleared = 0;
  GS.totalBallsUsed = 0;
  particles.length = 0;
  floatTexts.length = 0;

  // Hide all overlays
  document.getElementById('menu-overlay').classList.add('hidden');
  document.getElementById('floor-overlay').classList.remove('active');
  document.getElementById('runend-overlay').classList.remove('active');
  document.getElementById('shop-overlay').classList.remove('active');

  GS.screen = 'playing';
  startFloor();
}

function returnToMenu() {
  document.getElementById('runend-overlay').classList.remove('active');
  document.getElementById('menu-overlay').classList.remove('hidden');
  GS.screen = 'menu';
  // Clear Slot Protocol 2.0 state so it doesn't leak onto menu screen
  GS.frenzyReady = false;
  GS.frenzyActive = false;
  GS.comboCount = 0;
  updateHUD();
}

// ─── RENDERING ───────────────────────────────────────────────
function drawBackground() {
  // Grid
  ctx.strokeStyle = C.gridLine;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Drop zone line
  ctx.strokeStyle = '#00f0ff22';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(0, 90);
  ctx.lineTo(W, 90);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPegs() {
  const time = Date.now() / 1000;

  for (const peg of GS.board) {
    if (peg.destroyed) continue;

    const def = PEG_TYPES[peg.type];
    const pegColor = peg.crumblingColor || def.color;
    const pulse = 0.8 + Math.sin(time * 2 + peg.x * 0.1) * 0.2;

    // Glow
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, def.radius + 4, 0, Math.PI * 2);
    ctx.fillStyle = def.glow + '22';
    ctx.fill();

    // Peg body
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, def.radius, 0, Math.PI * 2);
    ctx.fillStyle = pegColor;
    ctx.shadowColor = pegColor;
    ctx.shadowBlur = 8 * pulse;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ICE hit counter
    if (peg.type === 'ice' && peg.hitCount > 0) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(peg.x - 6 + i * 6, peg.y + def.radius + 5, 2, 0, Math.PI * 2);
        ctx.fillStyle = i < peg.hitCount ? '#ff8800' : '#333';
        ctx.fill();
      }
    }

    // ── CRUMBLING PEG: cracked overlay + hit dots ─────────────
    if (def.crumbling && !peg.destroyed) {
      const pegColor = peg.crumblingColor || def.color;
      // Crack lines overlay
      ctx.strokeStyle = pegColor + '88';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(peg.x - def.radius * 0.3, peg.y - def.radius * 0.5);
      ctx.lineTo(peg.x + def.radius * 0.2, peg.y + def.radius * 0.1);
      ctx.moveTo(peg.x + def.radius * 0.4, peg.y - def.radius * 0.2);
      ctx.lineTo(peg.x - def.radius * 0.1, peg.y + def.radius * 0.4);
      ctx.moveTo(peg.x - def.radius * 0.5, peg.y + def.radius * 0.2);
      ctx.lineTo(peg.x + def.radius * 0.3, peg.y - def.radius * 0.3);
      ctx.stroke();

      // Hit counter dots below peg (visible from distance)
      const maxHits = peg.hitsRemaining + (peg.hitCount || 0);
      const remaining = peg.hitsRemaining;
      for (let i = 0; i < maxHits; i++) {
        ctx.beginPath();
        ctx.arc(peg.x - (maxHits - 1) * 4.5 + i * 9, peg.y + def.radius + 8, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = i < remaining ? pegColor : '#222';
        ctx.shadowColor = i < remaining ? pegColor : 'transparent';
        ctx.shadowBlur = i < remaining ? 8 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Outer pulsing ring — visible tell that this is a crumbling peg
      const ringPulse = 0.4 + Math.sin(time * 3 + peg.y * 0.1) * 0.2;
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, def.radius + 6, 0, Math.PI * 2);
      ctx.strokeStyle = pegColor + '44';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = pegColor;
      ctx.shadowBlur = 6 * ringPulse;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Pulse red when 1 hit remaining
      if (peg.hitsRemaining === 1) {
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, def.radius + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff00aa66';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // ── SEISMIC PEG: bass-line oscillation glow ───────────────
    if (def.seismic && !peg.destroyed) {
      const osc = 0.7 + Math.sin(time * 6 + peg.y * 0.05) * 0.3;
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 15 * osc;
      // Re-draw peg with animated glow
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, def.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff00aa';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Boss target
    if (peg.boss) {
      const hpct = (peg.hits || 0) / peg.maxHits;
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, def.radius + 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(peg.x, peg.y, def.radius + 12, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffcc0044';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawBallDropZone() {
  const x = dropX;
  ctx.beginPath();
  ctx.arc(x, 70, BALL_RADIUS + 2, 0, Math.PI * 2);
  ctx.strokeStyle = '#00f0ff66';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function render() {
  // Screen shake
  ctx.save();
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
    screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
  }

  // Clear
  ctx.fillStyle = C.void;
  ctx.fillRect(0, 0, W, H);

  // Background
  drawBackground();

  // Board
  drawPegs();

  // Balls
  for (const ball of GS.ballsInPlay) {
    ball.draw();
  }

  // Drop zone
  if (GS.screen === 'playing' && canDrop) {
    drawBallDropZone();
  }

  // Particles
  drawParticles();
  drawFragments();
  drawShockwaves();

  // Float texts
  drawFloatTexts();

  // Screen flash
  if (screenFlash > 0) {
    ctx.fillStyle = screenFlashColor;
    ctx.globalAlpha = screenFlash;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    screenFlash *= 0.85;
    if (screenFlash < 0.01) screenFlash = 0;
  }

  // ── SLOW-MO: time dilation vignette ──────────────────────
  if (GS.slowmoBall && GS.slowmoBall.slowmoActive) {
    const vignette = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.7);
    vignette.addColorStop(0, 'transparent');
    vignette.addColorStop(1, 'rgba(30, 60, 120, 0.4)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

// ─── GAME LOOP ───────────────────────────────────────────────
function update() {
  if (GS.screen !== 'playing') return;

  // Update balls
  for (const ball of GS.ballsInPlay) {
    ball.update();
  }

  // Collision check
  checkCollisions();

  // Multiplier chain timer
  if (GS.chainTimer > 0) {
    GS.chainTimer--;
  } else if (GS.multiplier > 1) {
    GS.multiplier = Math.max(1, GS.multiplier - 0.5);
    updateMultiplierDisplay();
  }

  // Remove inactive balls
  GS.ballsInPlay = GS.ballsInPlay.filter(b => b.active);

  // Update particles
  updateParticles();
  updateFragments();
  updateShockwaves();
  updateFloatTexts();

  // Check no balls and no balls left
  if (GS.ballsInPlay.length === 0 && GS.balls <= 0 && GS.screen === 'playing') {
    // Check if objective was met
    if (GS.floorObjective.progress >= GS.floorObjective.target) {
      completeFloor();
    } else {
      // Failed floor
      triggerFlash('#ff224433', 0.3);
      endRun(false);
    }
  }

  // Check objective periodically
  if (GS.floorObjective.progress >= GS.floorObjective.target) {
    completeFloor();
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ─── INPUT HANDLING ──────────────────────────────────────────
canvas.addEventListener('mousemove', (e) => {
  if (GS.screen !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  dropX = Math.max(20, Math.min(W - 20, (e.clientX - rect.left) * (W / rect.width)));
});

canvas.addEventListener('click', (e) => {
  if (GS.screen !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  dropX = Math.max(20, Math.min(W - 20, (e.clientX - rect.left) * (W / rect.width)));
  dropBall();
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (GS.screen !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  dropX = Math.max(20, Math.min(W - 20, (touch.clientX - rect.left) * (W / rect.width)));
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (GS.screen !== 'playing') return;
  dropBall();
});

// Keyboard drop
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && GS.screen === 'playing') {
    dropBall();
  }
});

// ─── BUTTON BINDINGS ─────────────────────────────────────────
document.getElementById('start-btn').onclick = startNewRun;

document.getElementById('reset-btn').onclick = () => {
  if (confirm('Reset all progress? This cannot be undone.')) {
    localStorage.removeItem('slotprotocol');
    PERSIST = {
      reputation: 0,
      lifetimeBreach: 0,
      totalRuns: 0,
      bestFloor: 0,
      unlockedPayloads: ['scrambler', 'trojan'],
      unlockedUpgrades: []
    };
    GS.unlockedPayloads = ['scrambler', 'trojan'];
    GS.unlockedUpgrades = [];
    updateMenuStats();
  }
};

document.getElementById('shop-btn').onclick = () => {
  if (GS.screen === 'playing') {
    openShop();
  }
};

document.getElementById('shop-continue-btn').onclick = closeShop;

document.getElementById('floor-continue-btn').onclick = () => {
  document.getElementById('floor-overlay').classList.remove('active');
  openShop();
};

document.getElementById('runend-btn').onclick = returnToMenu;

// ─── INIT ────────────────────────────────────────────────────
loadPersist();
updateMenuStats();
gameLoop();
</script>
