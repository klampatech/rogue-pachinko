<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluster Ball — Slot Protocol 2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 101;
  }

  .label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #ffff00; text-shadow: 0 0 8px #ffff00, 0 0 20px #ffff00; margin-bottom: 8px; z-index: 10; }
  .sublabel { font-size: 10px; letter-spacing: 3px; color: #ff8800; text-shadow: 0 0 6px #ff8800; margin-bottom: 40px; z-index: 10; }

  .stage {
    position: relative;
    width: 480px;
    height: 320px;
    background: #0d0d1a;
    border: 1px solid #1a1a3a;
    border-radius: 4px;
    overflow: hidden;
    z-index: 10;
  }

  /* CRT edge */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  /* ─── PRE-SPLIT STATE ─────────────────────────────────────── */

  .pre-split-ball {
    position: absolute;
    left: 200px;
    top: 50px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ffffff, #aaddff 60%, rgba(0,200,255,0.3));
    box-shadow: 0 0 12px #ffffff, 0 0 30px rgba(0,200,255,0.5), 0 0 60px rgba(0,200,255,0.2);
    z-index: 30;
    animation: preSplitPulse 1.2s ease-in-out infinite;
  }

  /* Orbiting fragments */
  .fragment {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 6px #00ffff, 0 0 12px #00ffff;
    animation: orbit var(--dur, 1s) linear infinite;
    transform-origin: 213px 63px;
  }

  .fragment:nth-child(1) { --dur: 0.8s;  animation-delay: 0s; }
  .fragment:nth-child(2) { --dur: 0.8s;  animation-delay: -0.27s; }
  .fragment:nth-child(3) { --dur: 0.8s;  animation-delay: -0.53s; }

  @keyframes orbit {
    from { transform: rotate(0deg)   translateX(20px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
  }

  @keyframes preSplitPulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 12px #ffffff, 0 0 30px rgba(0,200,255,0.5); }
    50%       { transform: scale(1.15); box-shadow: 0 0 20px #ffffff, 0 0 50px rgba(0,200,255,0.8); }
  }

  /* ─── SPLIT BURST ─────────────────────────────────────────── */

  .burst-container {
    position: absolute;
    left: 213px;
    top: 63px;
    width: 0;
    height: 0;
    z-index: 25;
    animation: burstFlash 3s ease-out infinite;
  }

  @keyframes burstFlash {
    0%, 35% { opacity: 0; }
    40%      { opacity: 1; }
    60%      { opacity: 0; }
    100%     { opacity: 0; }
  }

  /* Radial burst lines */
  .burst-ring {
    position: absolute;
    left: -30px;
    top: -30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,255,0.6);
    animation: burstRing 3s ease-out infinite;
  }

  @keyframes burstRing {
    0%   { transform: scale(0.3); opacity: 1; }
    50%  { transform: scale(3);   opacity: 0; }
    100% { transform: scale(0.3); opacity: 0; }
  }

  /* Mini balls diverging */
  .mini-ball {
    position: absolute;
    left: 200px;
    top: 50px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ffffff, #00ccff);
    box-shadow: 0 0 8px #00ffff, 0 0 20px rgba(0,255,255,0.5);
    animation: diverge 3s ease-out infinite;
  }

  .mini-ball:nth-child(2) { animation-delay: 0s; }
  .mini-ball:nth-child(3) { animation-delay: 0s; }
  .mini-ball:nth-child(4) { animation-delay: 0s; }

  /* Diverging angles */
  @keyframes diverge {
    0%   { transform: translate(0, 0) scale(1);    opacity: 0; }
    38%  { transform: translate(0, 0) scale(1.1); opacity: 1; }
    45%  { opacity: 1; }
    80%  { opacity: 0.7; }
    100% { opacity: 0; }
  }

  .mini-ball:nth-child(2) { animation-name: divergeLeft;  animation-delay: 0s; animation-duration: 3s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .mini-ball:nth-child(3) { animation-name: divergeCenter; animation-delay: 0s; animation-duration: 3s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .mini-ball:nth-child(4) { animation-name: divergeRight; animation-delay: 0s; animation-duration: 3s; animation-iteration-count: infinite; animation-timing-function: ease-out; }

  @keyframes divergeLeft {
    0%   { transform: translate(0,0);    opacity: 0; }
    38%  { transform: translate(0,0);   opacity: 1; }
    100% { transform: translate(-120px, 180px); opacity: 0; }
  }
  @keyframes divergeCenter {
    0%   { transform: translate(0,0);    opacity: 0; }
    38%  { transform: translate(0,0);   opacity: 1; }
    100% { transform: translate(0px, 200px); opacity: 0; }
  }
  @keyframes divergeRight {
    0%   { transform: translate(0,0);    opacity: 0; }
    38%  { transform: translate(0,0);   opacity: 1; }
    100% { transform: translate(120px, 180px); opacity: 0; }
  }

  /* Spark trails on mini balls */
  .spark-trail {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ffff;
    box-shadow: 0 0 4px #00ffff;
    animation: trailSpark 3s ease-out infinite;
    opacity: 0;
  }

  .spark-trail:nth-child(5) { animation-delay: 0.05s; }
  .spark-trail:nth-child(6) { animation-delay: 0.1s; }
  .spark-trail:nth-child(7) { animation-delay: 0.15s; }

  @keyframes trailSpark {
    0%   { transform: translate(-130px, 50px);  opacity: 0; }
    40%  { opacity: 0.8; }
    70%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Pegs */
  .peg { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #1a3a4a; box-shadow: 0 0 4px #00ffff44; }
  .peg:nth-child(10) { left: 60px;  top: 80px; }
  .peg:nth-child(11) { left: 140px; top: 60px; }
  .peg:nth-child(12) { left: 320px; top: 70px; }
  .peg:nth-child(13) { left: 400px; top: 110px; }
  .peg:nth-child(14) { left: 100px; top: 160px; }
  .peg:nth-child(15) { left: 240px; top: 180px; }
  .peg:nth-child(16) { left: 330px; top: 170px; }
  .peg:nth-child(17) { left: 190px; top: 270px; }
  .peg:nth-child(18) { left: 290px; top: 260px; }
  .peg:nth-child(19) { left: 400px; top: 250px; }

  .mini-ball-spark-hit {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffff00;
    box-shadow: 0 0 8px #ffff00, 0 0 20px rgba(255,255,0,0.5);
    animation: miniHit 3s ease-out infinite;
    opacity: 0;
  }

  /* mini ball 1 hits left peg */
  .mini-ball-spark-hit:nth-child(20) { left: 52px; top: 72px; animation-delay: 1.2s; }
  /* mini ball 2 hits center area */
  .mini-ball-spark-hit:nth-child(21) { left: 232px; top: 172px; animation-delay: 1.4s; }
  /* mini ball 3 hits right peg */
  .mini-ball-spark-hit:nth-child(22) { left: 392px; top: 102px; animation-delay: 1.6s; }

  @keyframes miniHit {
    0%   { transform: scale(0.2); opacity: 1; }
    30%  { transform: scale(2);   opacity: 0; }
    100% { transform: scale(0.2); opacity: 0; }
  }

  .info-bar { margin-top: 24px; display: flex; gap: 40px; z-index: 10; }
  .info-item { text-align: center; }
  .info-item .key { font-size: 9px; letter-spacing: 2px; color: #444; text-transform: uppercase; }
  .info-item .val { font-size: 13px; color: #ffff00; text-shadow: 0 0 6px #ffff00; margin-top: 4px; }

  .rarity-badge {
    position: absolute; top: 10px; right: 12px; font-size: 8px; letter-spacing: 2px;
    padding: 3px 8px; border: 1px solid #ffff00; color: #ffff00; text-shadow: 0 0 4px #ffff00;
    box-shadow: 0 0 8px rgba(255,255,0,0.3); z-index: 10;
  }

  .unlock-info { margin-top: 16px; font-size: 9px; color: #666; letter-spacing: 2px; z-index: 10; }
</style>
</head>
<body>

<div class="label">Cluster Ball</div>
<div class="sublabel">Payload · Split on Contact · Ghost Rank</div>

<div class="stage">
  <div class="rarity-badge">LEGENDARY</div>

  <!-- Pre-split: orbiting core -->
  <div class="pre-split-ball">
    <div class="fragment"></div>
    <div class="fragment"></div>
    <div class="fragment"></div>
  </div>

  <!-- Split burst -->
  <div class="burst-container">
    <div class="burst-ring"></div>
  </div>

  <!-- Three mini balls diverging -->
  <div class="mini-ball"></div>
  <div class="mini-ball"></div>
  <div class="mini-ball"></div>

  <!-- Spark trails -->
  <div class="spark-trail"></div>
  <div class="spark-trail"></div>
  <div class="spark-trail"></div>

  <!-- Pegs -->
  <div class="peg"></div><div class="peg"></div><div class="peg"></div>
  <div class="peg"></div><div class="peg"></div><div class="peg"></div>
  <div class="peg"></div><div class="peg"></div><div class="peg"></div>
  <div class="peg"></div>

  <!-- Mini ball hit sparks -->
  <div class="mini-ball-spark-hit"></div>
  <div class="mini-ball-spark-hit"></div>
  <div class="mini-ball-spark-hit"></div>
</div>

<div class="info-bar">
  <div class="info-item"><div class="key">Balls Active</div><div class="val">×3 MINI</div></div>
  <div class="info-item"><div class="key">Speed</div><div class="val">1.3× NORMAL</div></div>
  <div class="info-item"><div class="key">Payload</div><div class="val">NONE</div></div>
</div>

<div class="unlock-info">UNLOCK: GHOST RANK</div>

</body>
</html>
