<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seismic Pegs — Slot Protocol 2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 101;
  }

  .label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #ff00aa; text-shadow: 0 0 8px #ff00aa, 0 0 20px #ff00aa; margin-bottom: 8px; z-index: 10; }
  .sublabel { font-size: 10px; letter-spacing: 3px; color: #ff00aa; text-shadow: 0 0 6px #ff00aa; margin-bottom: 40px; z-index: 10; }

  .stage {
    position: relative;
    width: 480px;
    height: 320px;
    background: #0d0d1a;
    border: 1px solid #1a1a3a;
    border-radius: 4px;
    overflow: hidden;
    z-index: 10;
  }

  /* Screen shake container */
  .shake-wrapper {
    position: absolute;
    inset: 0;
    animation: screenShake 2s ease-out infinite;
  }

  @keyframes screenShake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-4px, 2px); }
    20%  { transform: translate(3px, -3px); }
    30%  { transform: translate(-2px, 4px); }
    40%  { transform: translate(4px, -2px); }
    50%  { transform: translate(-3px, 3px); }
    60%  { transform: translate(2px, -4px); }
    70%  { transform: translate(-4px, 2px); }
    80%  { transform: translate(3px, -3px); }
    90%  { transform: translate(-2px, 4px); }
    100% { transform: translate(0, 0); }
  }

  /* Bass thud vignette pulse */
  .bass-pulse {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(80,0,40,0.6) 100%);
    animation: bassPulse 2s ease-out infinite;
    pointer-events: none;
    z-index: 40;
  }

  @keyframes bassPulse {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    40%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Seismic peg — pulsing magenta */
  .seismic-peg {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ff44cc, #ff00aa, #880055);
    box-shadow: 0 0 10px #ff00aa, 0 0 25px rgba(255,0,170,0.6), 0 0 50px rgba(255,0,170,0.3);
    z-index: 20;
    animation: seismicPulse 0.8s ease-in-out infinite;
  }

  @keyframes seismicPulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 10px #ff00aa, 0 0 25px rgba(255,0,170,0.6); }
    50%       { transform: scale(1.15); box-shadow: 0 0 20px #ff00aa, 0 0 45px rgba(255,0,170,0.9), 0 0 70px rgba(255,0,170,0.4); }
  }

  .seismic-peg:nth-child(1) { left: 100px; top: 80px;  animation-delay: 0s; }
  .seismic-peg:nth-child(2) { left: 240px; top: 140px; animation-delay: 0.3s; }

  /* Bass oscillation ring */
  .bass-ring {
    position: absolute;
    left: 82px;
    top: 62px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,0,170,0.6);
    animation: bassRing 2s ease-out infinite;
    pointer-events: none;
    z-index: 15;
  }

  .bass-ring:nth-child(3) { animation-delay: 0s; }
  .bass-ring:nth-child(4) { animation-delay: 0.7s; }
  .bass-ring:nth-child(5) { animation-delay: 1.4s; }

  .bass-ring:nth-child(6) { left: 222px; top: 122px; animation-delay: 0.4s; }
  .bass-ring:nth-child(7) { left: 222px; top: 122px; animation-delay: 1.1s; }

  @keyframes bassRing {
    0%   { transform: scale(0.4); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Impact shockwave */
  .shockwave {
    position: absolute;
    left: 72px;
    top: 52px;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 3px solid rgba(255,100,200,0.8);
    animation: shockwave 2s ease-out infinite;
    pointer-events: none;
    z-index: 25;
  }

  @keyframes shockwave {
    0%   { transform: scale(0.2); opacity: 1; }
    30%  { opacity: 0.8; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  /* 2x spark burst on impact */
  .spark-burst {
    position: absolute;
    left: 92px;
    top: 72px;
    width: 36px;
    height: 36px;
    z-index: 30;
    animation: sparkBurst 2s ease-out infinite;
  }

  .spark-burst::before,
  .spark-burst::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 0% 50%,   transparent 30%, rgba(255,200,100,0.9) 31%, rgba(255,200,100,0.9) 34%, transparent 35%),
      radial-gradient(circle at 100% 50%,  transparent 30%, rgba(255,200,100,0.9) 31%, rgba(255,200,100,0.9) 34%, transparent 35%),
      radial-gradient(circle at 50% 0%,    transparent 30%, rgba(255,200,100,0.9) 31%, rgba(255,200,100,0.9) 34%, transparent 35%),
      radial-gradient(circle at 50% 100%,  transparent 30%, rgba(255,200,100,0.9) 31%, rgba(255,200,100,0.9) 34%, transparent 35%),
      radial-gradient(circle at 50% 50%,   transparent 25%, rgba(255,200,100,0.7) 26%, rgba(255,200,100,0.7) 30%, transparent 31%);
  }

  @keyframes sparkBurst {
    0%, 12% { opacity: 0; transform: scale(0.5); }
    15%     { opacity: 1; transform: scale(1.2); }
    30%     { opacity: 0; transform: scale(1.8); }
    100%    { opacity: 0; }
  }

  /* Near-miss rumble pulse indicator */
  .near-miss {
    position: absolute;
    left: 340px;
    top: 100px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px dashed rgba(255,0,170,0.4);
    animation: nearMiss 3s ease-out infinite;
    pointer-events: none;
    z-index: 15;
  }

  @keyframes nearMiss {
    0%, 70% { opacity: 0; transform: scale(0.8); }
    75%      { opacity: 0.6; transform: scale(1); }
    90%      { opacity: 0.2; transform: scale(1.3); }
    100%     { opacity: 0; transform: scale(1.5); }
  }

  /* Near-miss mini spark */
  .near-miss::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: rgba(255,0,170,0.3);
    animation: nearMissPulse 3s ease-out infinite;
  }

  @keyframes nearMissPulse {
    0%, 73% { opacity: 0; }
    78%      { opacity: 1; }
    90%      { opacity: 0; }
    100%     { opacity: 0; }
  }

  /* Regular pegs */
  .peg { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #1a3a4a; box-shadow: 0 0 4px #00ffff44; }
  .peg:nth-child(10) { left: 60px;  top: 160px; }
  .peg:nth-child(11) { left: 170px; top: 200px; }
  .peg:nth-child(12) { left: 330px; top: 180px; }
  .peg:nth-child(13) { left: 410px; top: 150px; }
  .peg:nth-child(14) { left: 80px;  top: 260px; }
  .peg:nth-child(15) { left: 260px; top: 250px; }
  .peg:nth-child(16) { left: 400px; top: 260px; }

  .info-bar { margin-top: 24px; display: flex; gap: 40px; z-index: 10; }
  .info-item { text-align: center; }
  .info-item .key { font-size: 9px; letter-spacing: 2px; color: #444; text-transform: uppercase; }
  .info-item .val { font-size: 13px; color: #ff00aa; text-shadow: 0 0 6px #ff00aa; margin-top: 4px; }

  .rarity-badge {
    position: absolute; top: 10px; right: 12px; font-size: 8px; letter-spacing: 2px;
    padding: 3px 8px; border: 1px solid #ff00aa; color: #ff00aa; text-shadow: 0 0 4px #ff00aa;
    box-shadow: 0 0 8px rgba(255,0,170,0.3); z-index: 10;
  }

  .unlock-info { margin-top: 16px; font-size: 9px; color: #666; letter-spacing: 2px; z-index: 10; }
</style>
</head>
<body>

<div class="label">Seismic Pegs</div>
<div class="sublabel">Peg Type · Screen Shake · Floor 3+</div>

<div class="stage">
  <div class="rarity-badge">UNCOMMON</div>

  <div class="shake-wrapper">
    <div class="bass-pulse"></div>

    <!-- Seismic pegs -->
    <div class="seismic-peg"></div>
    <div class="seismic-peg"></div>

    <!-- Bass oscillation rings -->
    <div class="bass-ring"></div>
    <div class="bass-ring"></div>
    <div class="bass-ring"></div>
    <div class="bass-ring"></div>
    <div class="bass-ring"></div>

    <!-- Shockwave ring -->
    <div class="shockwave"></div>

    <!-- 2x spark burst -->
    <div class="spark-burst"></div>

    <!-- Near miss indicator -->
    <div class="near-miss"></div>

    <!-- Regular pegs -->
    <div class="peg"></div><div class="peg"></div><div class="peg"></div>
    <div class="peg"></div><div class="peg"></div><div class="peg"></div>
    <div class="peg"></div>
  </div>
</div>

<div class="info-bar">
  <div class="info-item"><div class="key">Points / Hit</div><div class="val">+100 FLAT</div></div>
  <div class="info-item"><div class="key">Shake Amp</div><div class="val">6px / 200ms</div></div>
  <div class="info-item"><div class="key">Spark</div><div class="val">2× NORMAL</div></div>
  <div class="info-item"><div class="key">Near Miss</div><div class="val">RUMBLE PULSE</div></div>
</div>

<div class="unlock-info">UNLOCK: FLOOR 3+ (ALL PLAYERS)</div>

</body>
</html>
