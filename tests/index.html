<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogue Pachinko — Test Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #00f0ff; height: 100vh; display: flex; }
  #sidebar { width: 340px; min-width: 340px; height: 100vh; overflow-y: auto; background: #111; border-right: 1px solid #222; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #game-frame { flex: 1; height: 100vh; border: none; display: block; }
  .hdr { font-size: 11px; color: #ff00aa; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
  .suite { color: #ff00aa; font-weight: bold; font-size: 13px; padding: 4px 0 2px; border-bottom: 1px solid #333; margin-top: 8px; cursor: pointer; }
  .test { font-size: 11px; padding: 2px 0 2px 14px; display: flex; align-items: center; gap: 6px; }
  .test-name { flex: 1; }
  .pass { color: #00ff88; } .fail { color: #ff4444; font-weight: bold; } .skip { color: #ffaa00; }
  .err { color: #ff6600; font-size: 10px; }
  #summary { position: sticky; bottom: 0; background: #111; border-top: 1px solid #333; padding: 8px 0; font-size: 12px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls input { background: #1a1a2e; color: #00f0ff; border: 1px solid #333; padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; }
  .controls input { width: 80px; }
  #status { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="hdr">Rogue Pachinko — Test Suite</div>
  <div class="controls">
    <button id="btn-run">&#9654; Run All</button>
    <button id="btn-rerun">&#8635; Re-run Failed</button>
    <input id="in-seed" placeholder="seed" title="Force RNG seed">
    <input id="in-floor" placeholder="floor" title="Start at floor N">
  </div>
  <div id="output"></div>
  <div id="summary"></div>
</div>
<iframe id="game-frame"></iframe>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// Test Runner — loads game in isolated iframe, runs test modules, reports
// ─────────────────────────────────────────────────────────────────────────────

const GAME_SRC = '/index.html';
let lastFailed = [];
let currentSeed = null;
let currentFloor = null;

function log(html) {
  document.getElementById('output').insertAdjacentHTML('beforeend', html + '\n');
}

function logSuite(name) {
  log('<div class="suite">&#9658; ' + name + '</div>');
}

function logTest(name, status, ms, errMsg) {
  var icon = status === 'PASS' ? '&#10003;' : status === 'FAIL' ? '&#10007;' : '&#9675;';
  var cls  = status === 'PASS' ? 'pass' : status === 'FAIL' ? 'fail' : 'skip';
  var html = '<div class="test ' + cls + '"><span class="test-name">' + icon + ' ' + name + '</span>';
  if (ms !== undefined) html += '<span style="color:#555;font-size:10px">' + ms + 'ms</span>';
  if (errMsg) html += '<div class="err">&#8594; ' + errMsg + '</div>';
  html += '</div>';
  log(html);
}

// Load test files and call their runTests() with a TEST helper
async function loadTests() {
  // Discover all tests/tests/*.test.js under tests/
  return [
    './tests/a00_core.test.js',
    './tests/a01_persistence.test.js',
    './tests/a02_game_flow.test.js',
    './tests/b01_ball_physics.test.js',
    './tests/b02_drop_mechanics.test.js',
    './tests/b03_collision.test.js',
    './tests/b04_peg_types.test.js',
    './tests/c01_slot_collector.test.js',
    './tests/c02_jackpot.test.js',
    './tests/d01_payloads.test.js',
    './tests/d02_evolutions.test.js',
    './tests/d03_multipliers.test.js',
    './tests/e01_shop.test.js',
    './tests/e02_mastery.test.js',
    './tests/e03_skins.test.js',
    './tests/e04_leaderboard.test.js',
    './tests/e05_achievements.test.js',
    './tests/f01_hud.test.js',
    './tests/f02_overlay_screens.test.js',
    './tests/f03_buttons.test.js',
    './tests/f04_tutorial_modals.test.js',
    './tests/g01_audio.test.js',
    './tests/g02_visual_effects.test.js',
    './tests/g03_rendering.test.js',
    './tests/h01_board_generation.test.js',
    './tests/h02_daily_challenge.test.js',
    './tests/h03_timelock.test.js',
    './tests/h04_ghosts.test.js',
    './tests/h05_boss.test.js',
    './tests/i01_prestige.test.js',
    './tests/i02_meta_progression.test.js',
    './tests/j01_known_bugs.test.js',
    './tests/k01_edge_cases.test.js',
  ];
}

async function runSuite(file, TEST) {
  logSuite(file);
  try {
    var resp = await fetch(file + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var code = await resp.text();

    var iwin = document.getElementById('game-frame').contentWindow;

    // Capture GS and PERSIST from iframe via refs
    var GS_REF      = { current: iwin.GS };
    var PERSIST_REF = { current: iwin.PERSIST };

    var id = 't' + Date.now() + '_' + Math.random().toString(36).slice(2);

    var resolver;
    var p = new Promise(function(r) { resolver = r; });

    function handler(msg) {
      if (!msg.data || msg.data.__testId !== id) return;
      window.removeEventListener('message', handler);
      clearTimeout(timer);
      resolver(msg.data);
    }
    window.addEventListener('message', handler);

    var timer = setTimeout(function() {
      window.removeEventListener('message', handler);
      resolver({ status: 'error', error: 'Timeout (>60s)', tests: [] });
    }, 60000);

    try {
      // Run inside iframe so GS/PERSIST are in scope; use data: URI import
      (0, iwin.eval)(`
        (async () => {
          var G = { current: window.GS };
          var P = { current: window.PERSIST };
          var T = {
            getGS:      function() { return G.current; },
            getPersist: function() { return P.current; },
            ok:         function(e, m) { if (!e) throw new Error(m || ""); return true; },
            log:        function() {
              var args = Array.prototype.slice.call(arguments);
              console.log("[TEST]", args.join(' '));
            },
          };
          var results;
          try {
            var mod = await import("data:text/javascript," + encodeURIComponent(code));
            results = await mod.runTests(T);
          } catch(e2) {
            throw new Error("Load error: " + e2.message);
          }
          parent.postMessage({ __testId: id, status: 'ok', tests: results }, '*');
        })()
      `);
    } catch(e) {
      clearTimeout(timer);
      window.removeEventListener('message', handler);
      return { status: 'error', error: e.message, tests: [] };
    }

    return await p;

  } catch(e) {
    logTest('FAILED TO LOAD ' + file, 'FAIL', undefined, e.message);
    return { status: 'error', error: e.message, tests: [] };
  }
}

function buildTestSummary(totals) {
  var total   = totals.total;
  var passed  = totals.passed;
  var failed  = totals.failed;
  var skipped = totals.skipped;
  var all  = total === passed + skipped ? ' style="color:#00ff88"' : '';
  var pStr = '<span class="pass">' + passed + ' passed</span>';
  var fStr = failed > 0 ? '<span class="fail">' + failed + ' failed</span>' : '';
  var sStr = skipped > 0 ? '<span class="skip">' + skipped + ' skipped</span>' : '';
  document.getElementById('summary').innerHTML =
    '<div' + all + '>TOTAL: ' + passed + '/' + total + '</div>' + pStr + ' ' + fStr + ' ' + sStr;
}

async function runAll() {
  log('<div style="color:#ff00aa;font-size:11px">&#9600;&#9600;&#9600; RUN ' + new Date().toISOString() + ' &#9600;&#9600;&#9600;</div>');

  var iframe = document.getElementById('game-frame');

  // Build URL with optional seed/floor params
  var url = new URL(GAME_SRC, location.href);
  if (currentSeed)  url.searchParams.set('seed',  currentSeed);
  if (currentFloor) url.searchParams.set('floor', currentFloor);

  // Load game — use iframe.src (no cross-origin issue with /index.html)
  var loadPromise = new Promise(function(r) { iframe.addEventListener('load', r, { once: true }); });
  iframe.src = url.href;
  await loadPromise;

  var iwin = iframe.contentWindow;

  // Quick check that GS is accessible
  var gsCheck;
  try {
    gsCheck = (0, iwin.eval)('typeof GS');
  } catch(e) {
    gsCheck = 'error';
  }
  if (gsCheck === 'undefined') {
    log('<div style="color:#ff4444">GS is undefined — iframe game did not load.</div>');
    return;
  }

  // Initialize game state before running tests
  var initCode = [
    '(async function() {',
    '  try { if (typeof loadPersist === "function") loadPersist(); } catch(e) {}',
    '  try { if (typeof gameLoop === "function") gameLoop(); } catch(e) {}',
    '  await new Promise(function(r) { setTimeout(r, 100); });',
    '  parent.postMessage({__testReady: true}, "*");',
    '})();'
  ].join('\n');

  var readyResolver;
  var readyPromise = new Promise(function(r) { readyResolver = r; });
  function readyHandler(msg) {
    if (msg.data && msg.data.__testReady) {
      window.removeEventListener('message', readyHandler);
      clearTimeout(readyTimer);
      readyResolver();
    }
  }
  window.addEventListener('message', readyHandler);
  var readyTimer = setTimeout(function() {
    window.removeEventListener('message', readyHandler);
    readyResolver();
  }, 5000);
  (0, iwin.eval)(initCode);
  await readyPromise;

  var files = await loadTests();
  var totals = { total: 0, passed: 0, failed: 0, skipped: 0 };

  for (var fi = 0; fi < files.length; fi++) {
    var file = files[fi];
    var result = await runSuite(file);

    if (result.status === 'error') {
      logTest('LOAD ERROR', 'FAIL', undefined, result.error);
      totals.failed++;
      totals.total++;
      lastFailed.push(file);
      continue;
    }

    var tests = result.tests || [];
    var passed = 0, failed = 0, skipped = 0;
    for (var ti = 0; ti < tests.length; ti++) {
      var t = tests[ti];
      var status = t.skip ? 'SKIP' : t.pass !== false ? 'PASS' : 'FAIL';
      logTest(t.name || file, status, t.ms, t.error);
      if (t.skip) skipped++;
      else if (t.pass !== false) passed++;
      else failed++;
    }
    totals.total   += tests.length;
    totals.passed += passed;
    totals.failed += failed;
    totals.skipped += skipped;
    if (failed > 0) lastFailed.push(file);
  }

  buildTestSummary(totals);
  log('<div style="color:#ff00aa;font-size:11px">&#9604;&#9604;&#9604; END &#9604;&#9604;&#9604;</div>');
}

document.getElementById('btn-run').addEventListener('click', runAll);
document.getElementById('btn-rerun').addEventListener('click', function() {
  if (lastFailed.length) { log('<div style="color:#ff00aa">&#8635; Re-running failed suites...</div>'); runAll(); }
});

document.getElementById('in-seed').addEventListener('change', function(e) { currentSeed  = e.target.value || null; });
document.getElementById('in-floor').addEventListener('change', function(e) { currentFloor = e.target.value || null; });

// Auto-run on ?autorun=1 — defer by one tick so DOM is ready
if (new URL(location.href).searchParams.get('autorun') === '1') {
  setTimeout(runAll, 0);
}

</script>
</body>
</html>
