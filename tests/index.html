<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogue Pachinko — Test Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #00f0ff; height: 100vh; display: flex; }
  #sidebar { width: 340px; min-width: 340px; height: 100vh; overflow-y: auto; background: #111; border-right: 1px solid #222; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #game-frame { flex: 1; height: 100vh; border: none; display: block; }
  .hdr { font-size: 11px; color: #ff00aa; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
  .suite { color: #ff00aa; font-weight: bold; font-size: 13px; padding: 4px 0 2px; border-bottom: 1px solid #333; margin-top: 8px; cursor: pointer; }
  .test { font-size: 11px; padding: 2px 0 2px 14px; display: flex; align-items: center; gap: 6px; }
  .test-name { flex: 1; }
  .pass { color: #00ff88; } .fail { color: #ff4444; font-weight: bold; } .skip { color: #ffaa00; }
  .err { color: #ff6600; font-size: 10px; }
  #summary { position: sticky; bottom: 0; background: #111; border-top: 1px solid #333; padding: 8px 0; font-size: 12px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls input { background: #1a1a2e; color: #00f0ff; border: 1px solid #333; padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; }
  .controls input { width: 80px; }
  #status { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="hdr">Rogue Pachinko — Test Suite</div>
  <div class="controls">
    <button id="btn-run">▶ Run All</button>
    <button id="btn-rerun">↺ Re-run Failed</button>
    <input id="in-seed" placeholder="seed" title="Force RNG seed">
    <input id="in-floor" placeholder="floor" title="Start at floor N">
  </div>
  <div id="output"></div>
  <div id="summary"></div>
</div>
<iframe id="game-frame" sandbox="allow-scripts allow-same-origin"></iframe>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// Test Runner — loads game in isolated iframe, runs test modules, reports
// ─────────────────────────────────────────────────────────────────────────────

const GAME_SRC = '/index.html';
let lastFailed = [];
let currentSeed = null;
let currentFloor = null;

function log(html) {
  document.getElementById('output').insertAdjacentHTML('beforeend', html + '\n');
}

function logSuite(name) {
  log('<div class="suite">&#9658; ' + name + '</div>');
}

function logTest(name, status, ms, errMsg) {
  var icon = status === 'PASS' ? '&#10003;' : status === 'FAIL' ? '&#10007;' : '&#9675;';
  var cls  = status === 'PASS' ? 'pass' : status === 'FAIL' ? 'fail' : 'skip';
  var html = '<div class="test ' + cls + '"><span class="test-name">' + icon + ' ' + name + '</span>';
  if (ms !== undefined) html += '<span style="color:#555;font-size:10px">' + ms + 'ms</span>';
  if (errMsg) html += '<div class="err">&#8594; ' + errMsg + '</div>';
  html += '</div>';
  log(html);
}

// Load test file via fetch + data: URI import inside iframe (avoids CORS)
async function runSuite(file, iframe, TEST) {
  logSuite(file);
  try {
    // Fetch test file text
    var resp = await fetch(file + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var code = await resp.text();

    var iwin = iframe.contentWindow;
    var id = 't' + Date.now() + '_' + Math.random().toString(36).slice(2);

    // Promise to receive results from iframe via postMessage
    var resolver;
    var p = new Promise(function(r) { resolver = r; });

    function handler(msg) {
      if (!msg.data || msg.data.__testId !== id) return;
      window.removeEventListener('message', handler);
      clearTimeout(timer);
      resolver(msg.data);
    }
    window.addEventListener('message', handler);

    var timer = setTimeout(function() {
      window.removeEventListener('message', handler);
      resolver({ status: 'error', error: 'Timeout (>60s)', tests: [] });
    }, 60000);

    try {
      // Inline code as a JSON string to avoid scope issues in eval
      var codeJson = JSON.stringify(code);
      // Run inside iframe with data: URI import — GS/PERSIST in scope via refs
      (0, iwin.eval)(
        '(async () => {' +
          'var G = { current: window.GS };' +
          'var P = { current: window.PERSIST };' +
          'var T = {' +
            'getGS: function() { return G.current; },' +
            'getPersist: function() { return P.current; },' +
            'ok: function(v, m) { if (!v) throw new Error(m || "assertion failed"); return true; },' +
            'log: function() { var a = Array.prototype.slice.call(arguments); console.log("[TEST]", a.join(" ")); },' +
            'seed: function(n) { window._boardSeed = n; window._rngState = n; },' +
            'gotoFloor: function(n) { if (window.startFloor) window.startFloor(n); },' +
            'startRun: function() { if (window.startNewRun) window.startNewRun(); },' +
            'endRun: function() { if (window.endRun) window.endRun(false); },' +
            'returnToMenu: function() { if (window.returnToMenu) window.returnToMenu(); },' +
            'setBalls: function(n) { var g = window.GS; if (g) g.balls = n; },' +
            'setScore: function(n) { var g = window.GS; if (g) g.score = n; },' +
            'setFloor: function(n) { var g = window.GS; if (g) g.floor = n; },' +
            'setPayload: function(t) { var g = window.GS; if (g) { if (!g.activePayloads) g.activePayloads = []; g.activePayloads.push(t); } },' +
            'setCombo: function(n) { var g = window.GS; if (g) g.combo = n; },' +
            'setMultiplier: function(n) { var g = window.GS; if (g) g.multiplier = n; },' +
            'addCredits: function(n) { var g = window.GS; if (g) g.credits = (g.credits || 0) + n; },' +
            'subCredits: function(n) { var g = window.GS; if (g) g.credits = Math.max(0, (g.credits || 0) - n); },' +
            'click: function(q) { var el = window.document.querySelector(q); if (el) { el.focus(); var d = function(t) { el.dispatchEvent(new MouseEvent(t, {bubbles:true,cancelable:true,view:window})); }; d("mousedown"); d("mouseup"); d("click"); } },' +
            'type: function(q, txt) { var el = window.document.querySelector(q); if (el) { el.value = txt; el.dispatchEvent(new Event("input", {bubbles:true})); } },' +
            'wait: function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); },' +
            'waitRAF: function(n) { var p = Promise.resolve(); for (var i = 0; i < n; i++) p = p.then(function() { return new Promise(function(r) { requestAnimationFrame(r); }); }); return p; },' +
            'is: function(a, b, m) { return { ok: a === b, msg: m || (a + " === " + b) }; },' +
            'gt: function(a, b, m) { return { ok: a > b, msg: m || (a + " > " + b) }; },' +
            'lt: function(a, b, m) { return { ok: a < b, msg: m || (a + " < " + b) }; },' +
            'throws: function(fn, m) { try { fn(); return { ok: false, msg: m || "expected to throw" }; } catch(e) { return { ok: true, msg: m || "threw: " + e.message }; } },' +
            'equal: function(a, b, m) { var s = JSON.stringify(a), sb = JSON.stringify(b); return { ok: s === sb, msg: m || (s + " === " + sb) }; },' +
          '};' +
          'var results;' +
          'try {' +
            'var mod = await import("data:text/javascript," + encodeURIComponent(' + codeJson + '));' +
            'results = await mod.runTests(T);' +
          '} catch(e2) {' +
            'throw new Error("Load error: " + e2.message);' +
          '}' +
          'parent.postMessage({ __testId: id, status: "ok", tests: results }, "*");' +
        '})()'
      );
    } catch(e) {
      clearTimeout(timer);
      window.removeEventListener('message', handler);
      return { passed: 0, failed: 1, skipped: 0, tests: [], errors: [e.message] };
    }

    var result = await p;
    clearTimeout(timer);
    window.removeEventListener('message', handler);

    if (result.status === 'error') {
      logTest('RUNNER ERROR: ' + result.error, 'FAIL');
      return { passed: 0, failed: 1, skipped: 0, tests: [] };
    }

    var tests = result.tests || [];
    for (var i = 0; i < tests.length; i++) {
      logTest(tests[i].name, tests[i].status, tests[i].ms, tests[i].err);
    }
    return result;

  } catch(e) {
    logTest('FAILED TO LOAD ' + file, 'FAIL', undefined, e.message);
    return { passed: 0, failed: 1, skipped: 0, tests: [], errors: [e.message] };
  }
}

function buildTestSummary(totals) {
  var total   = totals.total;
  var passed  = totals.passed;
  var failed  = totals.failed;
  var skipped = totals.skipped;
  var all  = total === passed + skipped ? ' style="color:#00ff88"' : '';
  var pStr = '<span class="pass">' + passed + ' passed</span>';
  var fStr = failed > 0 ? '<span class="fail">' + failed + ' failed</span>' : '';
  var sStr = skipped > 0 ? '<span class="skip">' + skipped + ' skipped</span>' : '';
  document.getElementById('summary').innerHTML =
    '<div' + all + '>TOTAL: ' + passed + '/' + total + '</div>' + pStr + ' ' + fStr + ' ' + sStr;
}

async function runAll() {
  log('<div style="color:#ff00aa;font-size:11px">&#9600;&#9600;&#9600; RUN ' + new Date().toISOString() + ' &#9600;&#9600;&#9600;</div>');

  var iframe = document.getElementById('game-frame');

  // Build URL with optional seed/floor params
  var url = new URL(GAME_SRC, location.href);
  if (currentSeed)  url.searchParams.set('seed',  currentSeed);
  if (currentFloor) url.searchParams.set('floor', currentFloor);

  // Load game — use absolute path so iframe gets same origin
  var loadPromise = new Promise(function(r) { iframe.addEventListener('load', r, { once: true }); });
  iframe.src = url.href;
  await loadPromise;

  // Quick check that GS is accessible
  var gsCheck;
  try {
    gsCheck = iframe.contentWindow.GS;
  } catch(e) {
    log('<div style="color:#ff4444">ERROR: Cannot access GS — ' + e.message + '</div>');
    return;
  }

  // Get test file list
  var files = getTestFiles();
  var totals = { total: 0, passed: 0, failed: 0, skipped: 0 };

  for (var i = 0; i < files.length; i++) {
    var r = await runSuite(files[i], iframe, null);
    var testList = r.tests || [];
    for (var j = 0; j < testList.length; j++) {
      var t = testList[j];
      if (t.status === 'PASS') totals.passed++;
      else if (t.status === 'FAIL') totals.failed++;
      else totals.skipped++;
      totals.total++;
    }
    if (r.failed > 0) lastFailed.push(files[i]);
  }

  buildTestSummary(totals);
  log('<div style="color:#ff00aa;font-size:11px">&#9608;&#9608;&#9608; END &#9608;&#9608;&#9608;</div>');
}

// Build absolute test file URLs from the server root
function getTestFiles() {
  return [
    '/tests/tests/a00_core.test.js',
    '/tests/tests/a01_persistence.test.js',
    '/tests/tests/a02_game_flow.test.js',
    '/tests/tests/b01_ball_physics.test.js',
    '/tests/tests/b02_drop_mechanics.test.js',
    '/tests/tests/b03_collision.test.js',
    '/tests/tests/b04_peg_types.test.js',
    '/tests/tests/c01_slot_collector.test.js',
    '/tests/tests/c02_jackpot.test.js',
    '/tests/tests/d01_payloads.test.js',
    '/tests/tests/d02_evolutions.test.js',
    '/tests/tests/d03_multipliers.test.js',
    '/tests/tests/e01_shop.test.js',
    '/tests/tests/e02_mastery.test.js',
    '/tests/tests/e03_skins.test.js',
    '/tests/tests/e04_leaderboard.test.js',
    '/tests/tests/e05_achievements.test.js',
    '/tests/tests/f01_hud.test.js',
    '/tests/tests/f02_overlay_screens.test.js',
    '/tests/tests/f03_buttons.test.js',
    '/tests/tests/f04_tutorial_modals.test.js',
    '/tests/tests/g01_audio.test.js',
    '/tests/tests/g02_visual_effects.test.js',
    '/tests/tests/g03_rendering.test.js',
    '/tests/tests/h01_board_generation.test.js',
    '/tests/tests/h02_daily_challenge.test.js',
    '/tests/tests/h03_timelock.test.js',
    '/tests/tests/h04_ghosts.test.js',
    '/tests/tests/h05_boss.test.js',
    '/tests/tests/i01_prestige.test.js',
    '/tests/tests/i02_meta_progression.test.js',
    '/tests/tests/j01_known_bugs.test.js',
    '/tests/tests/k01_edge_cases.test.js',
  ];
}

document.getElementById('btn-run').addEventListener('click', runAll);
document.getElementById('btn-rerun').addEventListener('click', function() {
  if (lastFailed.length) { log('<div style="color:#ff00aa">&#8635; Re-running failed suites...</div>'); runAll(); }
});

document.getElementById('in-seed').addEventListener('change',  function(e) { currentSeed  = e.target.value || null; });
document.getElementById('in-floor').addEventListener('change', function(e) { currentFloor = e.target.value || null; });

// Auto-run on ?autorun=1
if (new URL(location.href).searchParams.get('autorun') === '1') {
  setTimeout(runAll, 0);
}
</script>
<script type="module" id="harness-embed">
window._testModules = [];
</script>
</body></html>
